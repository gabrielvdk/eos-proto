<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- published on GitHub Pages; keep it out of search engines -->
<title>EOS Tracker</title>
<!-- favicon = the top-bar logo (colours inlined: --green / --ink-3, CSS variables don't work in favicons) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27 fill=%27none%27%3E%3Cpath d=%27M4 18 L9 7 L14 13 L18 9 L23 18 Z%27 fill=%27%2319A974%27/%3E%3Cpath d=%27M2 20h22%27 stroke=%27%238A95A6%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#F3F5F9; --surface:#FFFFFF; --line:#E3E7EE; --line-strong:#C9D0DB;
  --ink:#1C2430; --ink-2:#5B6778; --ink-3:#8A95A6;
  --accent:#2F6FE4; --accent-soft:#E6EEFC;
  --green:#19A974; --green-deep:#0E7A5A; --green-soft:#DDF5EA;
  --red:#D93B4F; --red-deep:#A51E35; --red-soft:#FBE4E7;
  --amber:#E29A1C; --amber-soft:#FCF0D8;
  --grey-pill:#C7CDD7; --grey-fill:#8A95A6;
  --company:#5B4BDB; --department:#1F8FD1; --team:#19A974; --forum:#E2741C;
  --shadow:0 10px 30px rgba(28,36,48,.14);
  --radius:10px;
  --font-body:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  --font-title:"Titillium Web",Figtree,"Segoe UI",system-ui,sans-serif; /* titles only: app name, view h1, modal title (DESIGN.md §1) */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
    --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
    --accent:#6B9BFF; --accent-soft:#213353;
    --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
    --grey-pill:#3A4556; --grey-fill:#7D8898;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
  --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
  --accent:#6B9BFF; --accent-soft:#213353;
  --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
  --grey-pill:#3A4556; --grey-fill:#7D8898;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--ink);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:700;font-size:18px}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(28,36,48,.12)}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-solid:hover{filter:brightness(1.07);background:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--canvas);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
select.ctl{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600}
select.ctl.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.checks{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);user-select:none}
.checks label:last-child{border-right:0}
.checks label:has(input:checked){color:var(--ink)}
.checks input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.checks .dot{width:7px;height:7px}
tr.ctx td{opacity:.45}
tr.ctx td .pill,tr.ctx td .dot{filter:grayscale(1)}

main{max-width:1280px;margin:0 auto;padding:22px 24px 72px} /* bottom room for the fixed theme toggle */
.topfilter{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2)}
.topfilter .combo input{width:220px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600;cursor:pointer}
.topfilter .combo input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft);cursor:text}
.topfilter .combo.active input{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.topfilter .combo .list{font-weight:400;color:var(--ink)}
#tip{position:fixed;z-index:40;max-width:360px;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;display:none;white-space:pre-line}
#tip.show{display:block}
main.wide{max-width:none}
.viewhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.viewhead h1{font-family:var(--font-title);font-size:22px;margin:0;font-weight:700}
.viewhead .count{color:var(--ink-3);font-weight:500}

/* tables */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
th.sortable .arr{display:inline-block;width:12px;margin-left:4px;color:var(--ink-3);font-size:11px}
th.sortable[aria-sort="ascending"] .arr::after{content:"▲";color:var(--accent)}
th.sortable[aria-sort="descending"] .arr::after{content:"▼";color:var(--accent)}
thead th{text-align:left;font-weight:700;color:var(--ink);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
tbody td{padding:0 12px;height:46px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row:hover td{background:color-mix(in srgb,var(--canvas) 60%,var(--surface))}
td.title{font-weight:400}
.titlebtn{border:0;background:none;padding:0;text-align:left;font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:8px;max-width:100%}
.titlebtn:hover{color:var(--accent)}
.titlebtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.cell-link{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chev{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;padding:0}
.chev svg{width:12px;height:12px;transition:transform .18s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev.leaf{visibility:hidden}
.chev.lone{visibility:visible;border-style:dashed;border-color:var(--line);background:transparent;cursor:default;pointer-events:none}
.chev.lone svg{display:none}
.addrow td{height:40px;color:var(--ink-3)}
.addrow button{border:0;background:none;color:var(--ink-3);font-weight:500;padding:0}
.addrow button:hover{color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lvl-Company{background:color-mix(in srgb,var(--company) 14%,transparent);color:var(--company)}
.lvl-Department{background:color-mix(in srgb,var(--department) 14%,transparent);color:var(--department)}
.lvl-Team{background:color-mix(in srgb,var(--team) 16%,transparent);color:var(--team)}
.brtag{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--forum);background:color-mix(in srgb,var(--forum) 14%,transparent);border-radius:5px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.chkrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;justify-self:start}
.chkrow input{accent-color:var(--forum);width:14px;height:14px;margin:0}
.goalpill{background:var(--accent-soft);color:var(--accent)}
.teampill{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* status: coloured trigger button + custom menu (native <select> popups can't be styled on Windows) */
.st-not{background:var(--grey-pill)!important;color:var(--ink-2)!important}
.st-on{background:var(--green)!important}
.st-off{background:var(--red)!important}
.st-esc{background:var(--red-deep)!important}
.st-done{background:var(--green-deep)!important}
.st-can{background:repeating-linear-gradient(135deg,var(--grey-pill) 0 6px,color-mix(in srgb,var(--grey-pill) 70%,var(--surface)) 6px 12px)!important;color:var(--ink-2)!important}
.stbtn{position:relative;border:0;border-radius:7px;padding:5px 28px 5px 11px;font-weight:600;font-size:13px;min-width:132px;color:#fff;text-align:left;white-space:nowrap}
.stbtn.st-can{text-decoration:line-through}
.stbtn::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.8}
.stbtn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.stbtn:hover{filter:brightness(1.05)}
.field .stbtn{width:100%;padding-top:8px;padding-bottom:8px;border-radius:9px} /* status in the rock modal */
.stmenu{position:fixed;z-index:22;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:4px} /* above the modal backdrop (20), below the confirm dialog (25) */
.stmenu[hidden]{display:none}
.stmenu .it{display:grid;grid-template-columns:12px 1fr 16px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;text-align:left;font-size:13.5px;font-weight:500;color:var(--ink)}
.stmenu .it:hover,.stmenu .it:focus-visible{background:var(--canvas);outline:none}
.stmenu .it[aria-checked="true"]{font-weight:700}
.stmenu .it .sq{width:12px;height:12px;border-radius:4px}
.stmenu .it .ck{color:var(--accent);display:inline-flex}
.stmenu .it .ck svg{width:14px;height:14px}
.stmenu .sep{height:1px;background:var(--line);margin:4px 6px}
/* milestone toggle */
.ms-toggle{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 10px;font-weight:600;font-size:12.5px;color:var(--ink-2);min-width:68px}
.ms-toggle.done{background:var(--green);border-color:var(--green);color:#fff}

/* progress bar */
.prog{display:inline-flex;align-items:center;gap:8px}
.prog .bar{display:flex;height:16px;width:110px;border-radius:4px;overflow:hidden;background:var(--grey-pill)}
.prog .done{background:var(--green)}
.prog .over{background:var(--red)}
.prog.none .bar{background:transparent;border:1px dashed var(--line-strong)}

/* owner */
.owner{display:inline-flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* last update */
.lastupd{display:flex;align-items:center;gap:8px;min-width:0}
.lastupd .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:13px}
table.rocks{table-layout:auto}
table.rocks td.title,table.rocks th.fit,table.rocks td.fit{white-space:nowrap;width:1%}
table.rocks td.updcell{width:auto;min-width:220px;max-width:0}
table.rocks .treeline .titlebtn{flex:0 0 auto;min-width:0}
table.rocks .titlebtn .t{display:inline-block;max-width:420px;vertical-align:bottom}
.teamtag{font-size:11.5px;color:var(--ink-3);background:var(--canvas);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;font-weight:500;white-space:nowrap}
.lastupd .when{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.updbtn{border:0;background:none;color:var(--ink-3);padding:2px;border-radius:5px;display:inline-flex;flex:none}
.updbtn:hover{color:var(--accent);background:var(--accent-soft)}
.updbtn svg{width:16px;height:16px}
.updbtn.on{color:var(--accent);background:var(--accent-soft)}
td.updcell{position:relative}
.pop{position:fixed;z-index:8;width:320px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px}
.pop textarea{border:1px solid var(--line-strong);border-radius:8px;padding:8px;min-height:64px;resize:vertical;background:var(--surface);width:100%}
.pop textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pop .row{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.pop .hint{font-size:11.5px;color:var(--ink-3);margin-right:auto}

/* milestones subtable */
tr.sub>td{padding:0;background:var(--canvas)}
.subwrap{padding:10px 12px 12px 48px;border-left:4px solid var(--green);margin-left:14px}
.subwrap table{min-width:0;table-layout:fixed;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.subwrap thead th{font-size:12px;padding:8px 10px;font-weight:700;background:var(--surface)}
.subwrap tbody td{height:40px;padding:0 10px;background:var(--surface)}
.subwrap tr.overdue td{background:var(--red-soft)}
.subwrap .del{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:inline-flex;opacity:.55}
.subwrap tr:hover .del{opacity:1}
.subwrap .del:hover{color:var(--red);background:var(--red-soft)}
.subwrap .del svg{width:15px;height:15px}
.subwrap tr.overdue .dl{color:var(--red);font-weight:600}
.dl{font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.soon{color:var(--amber)}
input.inline{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%}
input.inline:hover{border-color:var(--line-strong)}
input.inline:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.inline.date{width:auto}

/* tree */
.treeline{display:flex;align-items:center;gap:8px;min-width:0}
.treeline .titlebtn{min-width:0;flex:1 1 auto}
.treeline .titlebtn .t{display:block}
table.tree{table-layout:fixed}
table.tree tbody td{height:36px;padding-top:0;padding-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tree .cell-link{max-width:100%}
table.tree .cell-link span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.group td{height:30px;background:var(--canvas);color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding-left:12px;white-space:nowrap}
tr.group td .n{font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--ink-3)}
table.tree td.title{padding-left:calc(12px + var(--depth,0) * 20px)}
table.tree .chev{width:20px;height:20px}
table.tree .pill{padding:2px 9px;font-size:12px}

/* searchable nested combobox */
.combo{position:relative}
.combo input{width:100%;padding-right:30px!important;text-overflow:ellipsis}
.combo::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.combo.open::after{transform:translateY(-30%) rotate(225deg)}
.combo.has-dot input{padding-left:28px!important}
.combo .cur-dot{position:absolute;left:12px;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%);pointer-events:none}
#f-unit .list{left:0;right:auto}
.combo .list{position:absolute;left:auto;right:0;width:max(100%,380px);top:calc(100% + 4px);max-height:320px;overflow-y:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);z-index:9;display:none;padding:4px}
.combo.open .list{display:block}
.combo .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.combo .item:hover,.combo .item.active{background:var(--accent-soft)}
.combo .item.sel{font-weight:600}
.combo .item.dis{color:var(--ink-3);cursor:default}
.combo .item.dis:hover{background:transparent}
.combo .item .t{flex:1 1 auto;min-width:0}
.combo .item .lvl{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;padding-left:8px}
.combo .none{padding:8px 10px;color:var(--ink-3);font-size:13px}
.combo .grp{padding:9px 10px 3px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.grid12{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:640px){.grid12{grid-template-columns:1fr}}
.mtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.hist{display:grid;gap:0}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.hist .h:last-child{border-bottom:0}
.hist .h .what{font-size:13.5px}
.hist .h .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(14,18,26,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:720px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--font-title);font-size:20px;font-weight:700;flex:1}
.modal .body{padding:18px 20px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end}
.field{display:grid;gap:5px;align-content:start} /* keep label + control at the top when a neighbouring field is taller */
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.modal.wide{max-width:1040px}
.twocol{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
.twocol>.main{border-right:1px solid var(--line);min-width:0}

    EOS Tracker

<script>
/* EOS Tracker — one file, no build step. Sections, in order:
   constants · ids & dates · session · data model & sample data · storage & migration · ui state · helpers ·
   shared renderers · views (plan, rocks, rock review, level 10) · render() · status menu · confirm dialog ·
   modals (goal, rock, card) · pickers · rich text · events · init */

/* ---------- constants ---------- */
const LEVELS=["Company","Department","Team"]; // goal levels, top-down; a goal's level follows from its unit (levelOf)
const STATUSES=[ // rock statuses: the key is stored, the label is shown
  {key:"not_set",  label:"Not Set",       cls:"st-not"},
  {key:"on_track", label:"On-Track",      cls:"st-on"},
  {key:"off_track",label:"Off-Track",     cls:"st-off"},
  {key:"escalate", label:"OT - Escalate", cls:"st-esc"},
  {key:"done",     label:"Done",          cls:"st-done"},
  {key:"cancelled",label:"Cancelled",     cls:"st-can"},
];
const COLS=[{key:"ids",label:"IDS"},{key:"todo",label:"To Do"},{key:"done",label:"Done"}]; // Level 10 board columns
const AGENDA=[ // Level 10 agenda: [name, minutes, link, sub-items]; link = "review" (the tab) or a board column
  ["Segue",5],["Scorecard",5],["Rock Review",5,"review"],["Customer / Employee Headlines",5],
  ["To-Do List",5,"todo"],["IDS",60,"ids"],["Conclude",5,null,["Recap To-Do List","Cascading Messages","Rating (1–10)"]],
];
const UNIT_LEVEL={company:"Company",department:"Department",team:"Team",forum:"Forum"}; // "Forum" only colours dots; goals never belong to a forum

/* ---------- ids & dates ---------- */
const uid=()=>globalThis.crypto?.randomUUID?.()??`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
const pad2=n=>String(n).padStart(2,"0");
const localISO=dt=>`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; // toISOString() would give yesterday east of UTC
let TODAY; // local midnight; refreshed by render() so a tab left open overnight moves on
function refreshToday(){const t=new Date();t.setHours(0,0,0,0);TODAY=t}
refreshToday();
const todayISO=()=>localISO(TODAY);
const nowStamp=()=>new Date().toISOString(); // when something happened (history, updates, created)
const parseD=s=>new Date(s+"T00:00:00"); // a calendar date (deadline) at local midnight
const stampDay=s=>!s?"":s.length<=10?s:localISO(new Date(s)); // older data stores plain dates instead of timestamps
const fmtDate=s=>s?parseD(stampDay(s)).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const fmtStamp=s=>!s||s.length<=10?fmtDate(s):`${fmtDate(s)}, ${new Date(s).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`;
const isPast=s=>!!s&&parseD(s)<TODAY;
const isSoon=s=>{if(!s)return false;const days=(parseD(s)-TODAY)/864e5;return days>=0&&days<=7};
const mondayOf=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const isoWeek=dt=>{const x=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));return Math.ceil(((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5+1)/7)};
const quarterOf=dt=>`Q${Math.floor(dt.getMonth()/3)+1} ${dt.getFullYear()}`;
const quarterParts=q=>{const m=/^Q([1-4]) (\d{4})$/.exec(q||"");return m?{n:+m[1],year:+m[2]}:null};
const quarterYear=q=>quarterParts(q)?.year??TODAY.getFullYear();
const quarterSortKey=q=>{const p=quarterParts(q);return p?p.year*4+p.n:0};
const quarterRange=q=>{const {n,year}=quarterParts(q);return [new Date(year,(n-1)*3,1),new Date(year,n*3,0)]};

/* ---------- session ----------
   Who is using the app. There is no sign-in yet: SSO will set session.userId (and provide the people list).
   Everything that records an author (history, updates, cards) reads currentUserId(). */
const session={userId:"p1"};
const currentUserId=()=>session.userId;

/* ---------- data model ----------
   All shared data lives in one object S (one per organisation; later: the database).
   S = {version, people, units, goals, rocks, cards}
   people  [{id, name, color}]
   units   [{id, kind:"company"|"department"|"team"|"forum", name, parentId}]
           A team's parentId is its department; other units have none. A department without teams acts as its own team (HR).
           A forum is a meeting (Business Review) that acts like a team for rocks and Level 10, but has no goals;
           it also has {includeTracked, includeEscalated}: show rocks tracked in it / rocks with status "escalate".
   goals   [{id, unitId, year, title, parentId, description, deliverables, history}]       level = levelOf(unitId)
   rocks   [{id, unitId, quarter:"Q4 2026", title, ownerId, status (STATUSES key), goalId, trackIn:[forum id],
             description, deliverables, milestones:[{id, title, done, deadline:"YYYY-MM-DD", updates}], updates, history}]
   cards   [{id, unitId, column (COLS key), title, description (sanitized HTML), owners:[person id], createdBy, createdAt, updates, history}]
   updates and history: [{at, who, text}], newest first; `at` is an ISO timestamp (older entries: a plain date, older updates: no `who`).
   Records refer to each other by id, never by name. */
const DATA_VERSION=8;

/* ---------- sample data (only used when this browser has no saved data) ---------- */
const DEMO_YEAR=2026; // the sample content is written for this year
const d=(m,day,y=DEMO_YEAR)=>`${y}-${pad2(m)}-${pad2(day)}`;
function seedOrg(){
  const units=[];
  const add=(kind,name,parentId=null,extra={})=>{const u={id:uid(),kind,name,parentId,...extra};units.push(u);return u};
  add("company","Hoogendoorn");
  [
    ["Product & Technology",["Data Science","Research","LG Dev","IIVO Dev","Hardware","Controls"]],
    ["Operations",["Engineering","IIVO Helpdesk","LG Service Desk","Customer Success","Contracts","T&C"]],
    ["Sales",["Project Sales","Direct Sales"]],
    ["Finance",["Legal","Accounting","Business Strategy"]],
    ["HR",[]],
  ].forEach(([name,teams])=>{const dep=add("department",name);teams.forEach(t=>add("team",t,dep.id))});
  add("forum","Business Review",null,{includeTracked:true,includeEscalated:true}); // every 4 weeks, team leaders
  return units;
}
function seed(){
  const units=seedOrg(),U=name=>units.find(u=>u.name===name).id;
  const people=[
    {id:"p1",name:"Mara Visser",color:"#5B4BDB"},{id:"p2",name:"Tom Bakker",color:"#1F8FD1"},
    {id:"p3",name:"Lena Groen",color:"#19A974"},{id:"p4",name:"Daan de Wit",color:"#E29A1C"},
    {id:"p5",name:"Sofie Jansen",color:"#D93B4F"},{id:"p6",name:"Ravi Patel",color:"#0E7A5A"},
    {id:"p7",name:"Jonas Müller",color:"#7C4DFF"},{id:"p8",name:"Eva Smit",color:"#00897B"},
    {id:"p9",name:"Noor Haddad",color:"#C2185B"},{id:"p10",name:"Pieter van Dijk",color:"#5D4037"}
  ];
  const G=(id,unit,title,parentId,description,deliverables)=>({id,unitId:U(unit),year:DEMO_YEAR,title,parentId,description,deliverables,
    history:[{at:d(1,19),who:"p2",text:"Deliverables updated"},{at:d(1,12),who:"p1",text:"Created"}]});
  const goals=[
    G("g1","Hoogendoorn","Profitable growth",null,"Grow revenue 25% while keeping EBITDA above 15%.","Revenue €12M • EBITDA ≥15% • Net revenue retention >105%"),

/* ---------- storage ----------
   The only code that knows where data lives. Today: this browser's localStorage (per device, not shared).
   With a backend, loadData()/save() become API calls; the rest of the app only reads S and calls save().
   Personal view settings (prefs, theme) are kept apart from the shared data. */
const DATA_KEY="eos-tracker-data";
const LEGACY_DATA_KEY="goals-rocks-v7"; // pre-v8 data, moved to DATA_KEY on first load
const PREFS_KEY="eos-tracker-prefs";
const THEME_KEY="eos-theme";
let S;
let storageProblem=null; // set when saving must not happen (unreadable data) or failed while moving old data
function loadData(){
  let raw=null,legacy=false;
  try{raw=localStorage.getItem(DATA_KEY);if(!raw){raw=localStorage.getItem(LEGACY_DATA_KEY);legacy=!!raw}}catch(e){} // storage blocked: run on sample data
  if(!raw)return seed();
  let data;
  try{data=migrate(JSON.parse(raw))}
  catch(e){
    console.error("Saved data could not be read",e);
    storageProblem="Not saved: the data saved in this browser couldn't be read, so it is left untouched."; // never overwrite it
    return seed();
  }
  if(legacy&&!moveLegacyData(data))storageProblem="Not saved: browser storage is full. Remove some pasted images.";
  return data;
}
function moveLegacyData(data){ // returns false when the new copy can't be stored (then the old one stays)
  const json=JSON.stringify(data);
  try{localStorage.setItem(DATA_KEY,json);localStorage.removeItem(LEGACY_DATA_KEY);return true}catch(e){}
  const old=localStorage.getItem(LEGACY_DATA_KEY); // no room for two copies: free the old one first, put it back if that fails too
  localStorage.removeItem(LEGACY_DATA_KEY);
  try{localStorage.setItem(DATA_KEY,json);return true}
  catch(e){localStorage.setItem(LEGACY_DATA_KEY,old);return false}
}
function save(){
  if(storageProblem){toast(storageProblem,5000);return false}
  try{localStorage.setItem(DATA_KEY,JSON.stringify(S));return true}
  catch(e){toast("Not saved: browser storage is full. Remove some pasted images.",5000);return false} // ~5 MB per site; screenshots use most of it
}
// bring saved data up to the current shape; add a step here (and bump DATA_VERSION) whenever the shape changes
function migrate(data){
  if(!data.version)data=migrateV7(data);
  return data;
}
// v7 and older: units referenced by name, stored goal levels, status labels, a single trackBR flag, no authors on updates
function migrateV7(old){
  const units=[],idByName=new Map();
  const add=(kind,name,parentId=null,extra={})=>{const u={id:uid(),kind,name,parentId,...extra};units.push(u);idByName.set(name,u.id);return u};
  add("company","Hoogendoorn");
  (old.departments||[]).forEach(dep=>{const u=add("department",dep.name);dep.teams.filter(t=>t!==dep.name).forEach(t=>add("team",t,u.id))}); // a team named like its department is the department
  const hadForums=!!old.forums;
  (old.forums||[{name:"Business Review",includeTracked:true,includeEscalated:true}])
    .forEach(f=>add("forum",f.name,null,{includeTracked:!!f.includeTracked,includeEscalated:!!f.includeEscalated}));
  const unitId=name=>{ // names outside the org structure become teams without a department
    if(name==="Company")name="Hoogendoorn"; // the company unit's old name
    if(!idByName.has(name))add("team",name);
    return idByName.get(name);
  };
  const statusKey=label=>label==="Off-Track Escalate"?"escalate":(STATUSES.find(s=>s.label===label)||STATUSES[0]).key;
  const forumId=units.find(u=>u.kind==="forum")?.id;
  const goals=(old.goals||[]).map(({level,team,...g})=>({...g,unitId:unitId(team),year:2026})); // v7 had one hard-coded year
  const rocks=(old.rocks||[]).map(({team,trackBR,...r})=>{
    const tracked=trackBR||(!hadForums&&(r.id==="r3"||r.id==="r19")); // the sample rocks were tracked when forums were added
    return {...r,unitId:unitId(team),status:statusKey(r.status),trackIn:tracked&&forumId?[forumId]:[]};
  });
  const cards=old.cards?old.cards.map(({team,...c})=>({...c,unitId:unitId(team)})):seedCards(unitId);
  return {version:DATA_VERSION,people:old.people||[],units,goals,rocks,cards};
}

/* organisation. A "unit" is what goals, rocks and cards belong to: the company, a department, a team or a forum. */
const unit=id=>S.units.find(u=>u.id===id);
const unitName=id=>unit(id)?.name??"Unknown team";
const company=()=>S.units.find(u=>u.kind==="company");
const departments=()=>S.units.filter(u=>u.kind==="department");
const teamsOf=deptId=>S.units.filter(u=>u.kind==="team"&&u.parentId===deptId);
const forums=()=>S.units.filter(u=>u.kind==="forum");
const isDept=id=>unit(id)?.kind==="department";
const isForum=id=>unit(id)?.kind==="forum";
const levelOf=id=>UNIT_LEVEL[unit(id)?.kind]||"Team";
const goalLevel=g=>levelOf(g.unitId);
const deptOf=id=>{const u=unit(id);return u?.kind==="department"?u.id:u?.kind==="team"?u.parentId:null};
const unitMatches=(id,filter)=>!filter||id===filter||(isDept(filter)&&deptOf(id)===filter); // a department filter includes its teams
const boardsOf=dept=>{const ts=teamsOf(dept.id);return ts.length?ts:[dept]}; // a department without teams has its own board
const hasBoard=id=>{const u=unit(id);return !!u&&(u.kind==="team"||u.kind==="forum"||(u.kind==="department"&&!teamsOf(u.id).length))};
const defaultUnitId=()=>{const dep=departments()[0];return (dep&&boardsOf(dep)[0].id)||company().id}; // later: the signed-in user's team

// rocks: a forum shows its own rocks plus the rocks its rules pull in from other teams
function rockMatches(r,filter){
  const f=isForum(filter)?unit(filter):null;
  if(!f)return unitMatches(r.unitId,filter);
  return r.unitId===f.id||(f.includeTracked&&(r.trackIn||[]).includes(f.id))||(f.includeEscalated&&r.status==="escalate");
}

function logHist(obj,text){(obj.history??=[]).unshift({at:nowStamp(),who:currentUserId(),text})}

function diffHist(before,after,labels){
  const out=[];
  for(const k in labels){const a=before[k]??"",b=after[k]??"";if(a!==b)out.push(labels[k](a,b))}
  return out;
}
// history lines for one changed milestone (rock modal and the inline editor on the Rocks tab)
function milestoneChanges(before,after){
  const out=[],t=after.title;
  if(before.done!==after.done)out.push(`Milestone “${t}” marked ${after.done?"done":"to do"}`);
  if(before.title!==after.title)out.push(`Milestone renamed to “${t}”`);
  if((before.deadline||"")!==(after.deadline||""))out.push(`Milestone “${t}” deadline ${after.deadline?`set to ${fmtDate(after.deadline)}`:"removed"}`);
  return out;
}
function toast(msg,ms=1600){
  const t=$("#toast");if(Date.now()<(t._lock||0))return; // a long (warning) toast isn't overwritten by a routine "saved" toast
  t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);
  if(ms>2000)t._lock=Date.now()+ms;
}

  moon:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8z"/></svg>',
};

/* ---------- shared renderers ---------- */
const updMeta=(u,withTime)=>[u.who?personName(u.who):"",withTime?fmtStamp(u.at):fmtDate(u.at)].filter(Boolean).join(" · ");
const updIsOpen=(obj,kind)=>updOpen?.kind===kind&&updOpen.id===obj.id;
function updPopHTML(obj,kind){
  if(!updIsOpen(obj,kind))return "";
  return `<div class="pop" data-pop><textarea data-pop-text placeholder="What's the latest on “${esc(obj.title)}”?"></textarea>
    <div class="row"><span class="hint">Enter to post · Esc to close</span><button class="btn sm" data-act="updcancel">Cancel</button><button class="btn sm primary" data-act="updpost">Post</button></div></div>`;
}
function lastUpdateHTML(obj,kind){
  const u=(obj.updates||[])[0];
  const btn=`<button class="updbtn ${updIsOpen(obj,kind)?"on":""}" title="Add update" data-act="addupd" data-kind="${kind}" data-id="${obj.id}">${ICONS.note}</button>`;
  const text=u?`<span class="txt" data-tip="${esc(`${u.text}\n— ${updMeta(u)}`)}">${esc(u.text)}</span><span class="when">${fmtDate(u.at)}</span>`:`<span class="txt muted">No updates yet</span>`;
  return `<div class="lastupd">${text}${btn}</div>${updPopHTML(obj,kind)}`;
}
function updatesListHTML(list){
  if(!list.length)return `<div class="muted">No updates yet.</div>`;
  return list.map(u=>`<div class="upd"><div>${esc(u.text)}</div><div class="meta">${esc(updMeta(u,true))}</div></div>`).join("");
}
function historyHTML(obj){
  const h=obj.history||[];
  if(!h.length)return `<div class="muted">No changes recorded yet.</div>`;
  return `<div class="hist">${h.map(e=>`<div class="h">${avatarHTML(e.who)}<div><div class="what">${esc(e.text)}</div><div class="meta">${esc(personName(e.who))} · ${fmtStamp(e.at)}</div></div></div>`).join("")}</div>`;
}
function progressHTML(r){
  const ms=r.milestones||[];
  if(!ms.length)return `<div class="prog none" data-tip="No milestones yet"><div class="bar"></div></div>`;
  const n=ms.length,done=ms.filter(m=>m.done).length,over=ms.filter(m=>!m.done&&isPast(m.deadline)).length;
  return `<div class="prog" data-tip="${done} of ${n} done${over?`, ${over} overdue`:""}"><div class="bar"><span class="done" style="width:${done/n*100}%"></span><span class="over" style="width:${over/n*100}%"></span></div></div>`;
}
function statusButtonHTML(status,attrs){
  const s=statusOf(status);
  return `<button type="button" class="stbtn ${s.cls}" ${attrs} aria-haspopup="menu" aria-expanded="false" aria-label="Status: ${esc(s.label)}">${esc(s.label)}</button>`;
}
function goalChainText(g){
  const chain=[];
  for(let cur=g,guard=0;cur&&guard<10;cur=cur.parentId?goal(cur.parentId):null,guard++)chain.unshift(cur);
  return chain.map((x,i)=>`${"   ".repeat(i)}${i?"↳ ":""}${x.title}  (${goalLevel(x)} · ${unitName(x.unitId)})`).join("\n");
}
function avatarHTML(id){
  const p=person(id);
  return `<span class="avatar" style="background:${p?esc(p.color):"var(--grey-fill)"}">${p?initials(p.name):"?"}</span>`;
}
function ownerHTML(id){
  const p=person(id);if(!p)return `<span class="muted">—</span>`;
  return `<span class="avatar" style="background:${esc(p.color)}" data-tip="${esc(p.name)}" aria-label="${esc(p.name)}">${initials(p.name)}</span>`;
}
const teamTagHTML=id=>id&&id!==teamFilter?`<span class="teamtag">${esc(unitName(id))}</span>`:""; // hidden when that team is filtered
const abbr=name=>name.split(/\s+/).map(w=>w[0]).join("").toUpperCase();
const trackTagsHTML=r=>(r.trackIn||[]).map(unit).filter(Boolean).map(f=>`<span class="brtag" title="Tracked in ${esc(f.name)}">${esc(abbr(f.name))}</span>`).join("");
const viewTitle=(title,id)=>`<h1>${title}${id?` <span class="dim">· ${esc(unitName(id))}</span>`:""}</h1>`;
const quarterSelectHTML=()=>`<select class="ctl" data-act="quarter" aria-label="Quarter">${quarterList().map(q=>`<option ${q===quarterFilter?"selected":""}>${q}</option>`).join("")}</select>`;
const legendHTML=(items,extra="")=>`<div class="legend" style="margin-top:10px">${items.map(([color,label])=>`<span><i class="sw" style="background:var(--${color})"></i> ${label}</span>`).join("")}${extra}</div>`;
const noRocksHTML=hint=>`<div class="empty"><b>No rocks for ${esc(quarterFilter)}${teamFilter?` in ${esc(unitName(teamFilter))}`:""} yet</b>${hint}</div>`;
const shownRocks=()=>S.rocks.filter(r=>r.quarter===quarterFilter&&rockMatches(r,teamFilter));

/* ---------- One Year Plan ---------- */
const az=(a,b)=>a.title.localeCompare(b.title);
const GOAL_SORTS={
  title:az,
  level:(a,b)=>LEVELS.indexOf(goalLevel(a))-LEVELS.indexOf(goalLevel(b))||az(a,b),
  team:(a,b)=>unitName(a.unitId).localeCompare(unitName(b.unitId))||az(a,b),
};
const goalSort=(key,dir)=>(a,b)=>dir*(GOAL_SORTS[key]||az)(a,b);
function renderPlan(){
  const all=S.goals.filter(g=>g.year===planYear),unitF=goalFilter();
  const filtering=levelFilter.size<LEVELS.length||!!unitF;
  let goals=all.filter(g=>levelFilter.has(goalLevel(g))&&unitMatches(g.unitId,unitF));
  const ctx=new Set(); // tree view: ancestors shown (greyed) for context
  if(planMode==="tree"&&filtering){
    const keep=new Set(goals.map(g=>g.id)),inYear=new Set(all.map(g=>g.id));
    goals.forEach(g=>{for(let p=g.parentId;p&&!keep.has(p)&&inYear.has(p);p=goal(p).parentId){ctx.add(p);keep.add(p)}});
    goals=all.filter(g=>keep.has(g.id));
  }
  const matched=goals.length-ctx.size;
  const forumNote=isForum(teamFilter)?`<span class="muted" style="font-size:12.5px">${esc(unitName(teamFilter))} has no goals, so all goals are shown ·</span>`:"";
  const head=`<div class="viewhead">${viewTitle(`One Year Plan ${planYear}`,unitF)}${forumNote}<span class="count">${filtering?`${matched} of ${all.length}`:all.length} goals</span><div class="spacer"></div>
    <div class="checks" role="group" aria-label="Filter by level">${LEVELS.map(l=>`<label><input type="checkbox" data-act="levelfilter" value="${l}" ${levelFilter.has(l)?"checked":""}><span class="dot" style="background:var(--${l.toLowerCase()})"></span>${l}</label>`).join("")}</div>
    ${planMode==="tree"?`<button class="btn sm" data-act="toggleall">${collapsed.size?"Expand all":"Collapse all"}</button>`:""}
    <div class="seg" role="group" aria-label="View"><button data-act="mode" data-mode="list" aria-pressed="${planMode==="list"}">List</button><button data-act="mode" data-mode="tree" aria-pressed="${planMode==="tree"}">Tree</button></div>
    <select class="ctl" data-act="year" aria-label="Year">${yearList().map(y=>`<option ${y===planYear?"selected":""}>${y}</option>`).join("")}</select>
    <button class="btn primary" data-act="newgoal">+ New goal</button></div>`;
  const th=(key,label,w)=>`<th class="sortable" style="width:${w}" data-act="sort" data-sort="${key}" aria-sort="${sortCol===key?(sortDir>0?"ascending":"descending"):"none"}">${label}<span class="arr"></span></th>`;
  const cols=`<thead><tr>${th("title","Title","44%")}${th("level","Level","14%")}${th("team","Team","16%")}${th("linked","Linked to goal","26%")}</tr></thead>`;
  const row=(g,depth,hasKids)=>goalRow(g,depth,hasKids,ctx.has(g.id));
  const linked=sortCol==="linked"; // "linked" sorts by hierarchy: roots in the chosen direction, children A→Z
  let rows="";
  if(planMode==="list"&&!linked)rows=[...goals].sort(goalSort(sortCol,sortDir)).map(g=>row(g,0,false)).join("");
  else{
    const tree=planMode==="tree",inSet=new Set(goals.map(g=>g.id));
    const kids=id=>goals.filter(g=>g.parentId===id).sort(linked?az:goalSort(sortCol,sortDir));
    const branch=(g,depth)=>{
      const ch=kids(g.id);
      if(!tree)return row(g,0,false)+ch.map(c=>branch(c,0)).join("");
      return row(g,depth,ch.length>0)+(collapsed.has(g.id)?"":ch.map(c=>branch(c,depth+1)).join(""));
    };
    const roots=goals.filter(g=>!inSet.has(g.parentId)).sort(linked?(a,b)=>sortDir*az(a,b):goalSort(sortCol,sortDir));
    const isCo=g=>goalLevel(g)==="Company",hasKids=g=>kids(g.id).length>0;
    const orphans=[...roots.filter(g=>!isCo(g)&&hasKids(g)),...roots.filter(g=>!isCo(g)&&!hasKids(g))]; // not linked to a Company goal; parents first
    rows=roots.filter(isCo).map(g=>branch(g,0)).join("");
    if(orphans.length)rows+=`<tr class="group"><td colspan="4">Not linked to a Company goal<span class="n">${orphans.length}</span></td></tr>`+orphans.map(g=>branch(g,0)).join("");
  }
  if(!goals.length)rows=`<tr><td colspan="4"><div class="empty"><b>No goals match these filters</b>Try a different level, team or year, or clear the filters.</div></td></tr>`;
  rows+=`<tr class="addrow"><td colspan="4"><button data-act="newgoal">+ Add goal</button></td></tr>`;
  return head+`<div class="board"><div class="scroll"><table class="${planMode==="tree"?"tree":""}">${cols}<tbody>${rows}</tbody></table></div></div>`;
}
function goalRow(g,depth,hasKids,isCtx){
  const parent=g.parentId?goal(g.parentId):null,level=goalLevel(g);
  const lone=!hasKids&&!g.parentId&&level!=="Company"; // tree view: dashed box = not linked to anything
  const chev=planMode==="tree"?`<button class="chev ${hasKids?"":"leaf"}${lone?" lone":""}" data-act="collapse" data-id="${g.id}" aria-expanded="${!collapsed.has(g.id)}" aria-label="Toggle children">${ICONS.chev}</button>`:"";
  return `<tr class="row ${isCtx?"ctx":""}" ${isCtx?'title="Shown for context — does not match the filter"':""}>
    <td class="title" style="--depth:${depth}"><span class="treeline">${chev}<button class="titlebtn" data-act="editgoal" data-id="${g.id}"><span class="t">${esc(g.title)}</span></button></span></td>
    <td><span class="pill lvl-${level}">${level}</span></td>
    <td><span class="pill teampill">${esc(unitName(g.unitId))}</span></td>
    <td>${parent?`<span class="cell-link"><span class="dot" style="background:var(--${goalLevel(parent).toLowerCase()})"></span>${esc(parent.title)}</span>`:`<span class="muted">—</span>`}</td></tr>`;
}

/* ---------- Rocks ---------- */
function renderRocks(){
  const rocks=shownRocks();
  const head=`<div class="viewhead">${viewTitle("Rocks",teamFilter)}<span class="count">${rocks.length} this quarter</span><div class="spacer"></div>
    ${quarterSelectHTML()}<button class="btn primary" data-act="newrock">+ New rock</button></div>`;
  const cols=`<thead><tr><th class="fit">Title</th><th class="fit">Owner</th><th class="fit">Status</th><th class="fit">Progress</th><th>Last update</th><th class="fit">Goal</th></tr></thead>`;
  let rows=rocks.length?rocks.map(rockRow).join(""):`<tr><td colspan="6">${noRocksHTML("Add the first 90-day rock for this quarter.")}</td></tr>`;
  rows+=`<tr class="addrow"><td colspan="6"><button data-act="newrock">+ Add rock</button></td></tr>`;
  return head+`<div class="board"><div class="scroll"><table class="rocks">${cols}<tbody>${rows}</tbody></table></div></div>`
    +legendHTML([["green","done"],["red","overdue"],["grey-pill","to do"]]);
}
function rockRow(r){
  const g=r.goalId?goal(r.goalId):null,open=expanded.has(r.id),n=r.milestones.length;
  const main=`<tr class="row"><td class="title"><span class="treeline"><button class="chev" data-act="expand" data-id="${r.id}" aria-expanded="${open}" aria-label="Show milestones">${ICONS.chev}</button><button class="titlebtn" data-act="editrock" data-id="${r.id}"><span class="t">${esc(r.title)}</span></button>${n?`<span class="muted" style="font-size:12px">${n}</span>`:""}${teamTagHTML(r.unitId)}${trackTagsHTML(r)}</span></td>
    <td class="fit">${ownerHTML(r.ownerId)}</td>
    <td class="fit">${statusButtonHTML(r.status,`data-act="statusmenu" data-id="${r.id}"`)}</td>
    <td class="fit">${progressHTML(r)}</td>
    <td class="updcell">${lastUpdateHTML(r,"rock")}</td>
    <td class="fit">${g?`<span class="pill goalpill" data-tip="${esc(goalChainText(g))}">${esc(g.title)}</span>`:`<span class="muted">—</span>`}</td></tr>`;
  if(!open)return main;
  const msRow=m=>{
    const over=!m.done&&isPast(m.deadline),soon=!m.done&&!over&&isSoon(m.deadline),ids=`data-rock="${r.id}" data-id="${m.id}"`;
    return `<tr class="${over?"overdue":""}"><td><input class="inline" value="${esc(m.title)}" data-act="mtitle" ${ids} aria-label="Milestone title"></td>
      <td><button class="ms-toggle ${m.done?"done":""}" data-act="mtoggle" ${ids}>${m.done?"Done":"To do"}</button></td>
      <td><input type="date" class="inline date dl ${soon?"soon":""}" value="${esc(m.deadline)}" data-act="mdate" ${ids} aria-label="Deadline"></td>
      <td class="updcell">${lastUpdateHTML(m,"ms:"+r.id)}</td>
      <td><button class="del" data-act="msdel" ${ids} aria-label="Delete milestone" data-tip="Delete milestone">${ICONS.trash}</button></td></tr>`;
  };
  return main+`<tr class="sub"><td colspan="6"><div class="subwrap"><table><colgroup><col style="width:34%"><col style="width:96px"><col style="width:160px"><col><col style="width:44px"></colgroup>
    <thead><tr><th>Milestone</th><th>Status</th><th>Deadline</th><th>Last update</th><th></th></tr></thead>
    <tbody>${r.milestones.map(msRow).join("")}<tr class="addrow"><td colspan="5"><button data-act="newms" data-id="${r.id}">+ Add milestone</button></td></tr></tbody></table></div></td></tr>`;
}

/* ---------- Rock Review (meeting view: rocks × weeks) ---------- */
function renderReview(){
  const rocks=shownRocks();
  // weeks span the quarter, widened to include every milestone deadline of the shown rocks
  let [start,end]=quarterRange(quarterFilter);
  rocks.forEach(r=>r.milestones.forEach(m=>{if(!m.deadline)return;const dt=parseD(m.deadline);if(dt<start)start=dt;if(dt>end)end=dt}));
  const weeks=[];
  for(const w=mondayOf(start);w<=end;w.setDate(w.getDate()+7))weeks.push(localISO(w));
  const nowWk=localISO(mondayOf(TODAY));
  const wkCls=k=>k<nowWk?"past":k===nowWk?"now":"";
  const head=`<div class="viewhead">${viewTitle("Rock Review",teamFilter)}<span class="count">${plural(rocks.length,"rock")} · week ${isoWeek(TODAY)}</span><div class="spacer"></div>${quarterSelectHTML()}</div>`;
  const cols=`<thead><tr>${weeks.map(k=>`<th class="wk ${wkCls(k)}" ${k===nowWk?'aria-current="date"':""}><div class="n">Wk ${isoWeek(parseD(k))}</div><div class="dt">${fmtDate(k)}</div></th>`).join("")}</tr></thead>`;
  const chip=(r,m)=>{
    const over=!m.done&&isPast(m.deadline),soon=!m.done&&!over&&isSoon(m.deadline),u=(m.updates||[])[0];
    const day=parseD(m.deadline).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    const tip=`${m.title}\nDeadline ${day}${m.done?" · done":over?" · overdue":""}${u?`\nLatest: ${u.text}`:""}\nClick to mark ${m.done?"to do":"done"}`;
    return `<button class="chip ${m.done?"done":over?"over":soon?"soon":""}" data-act="mtoggle" data-rock="${r.id}" data-id="${m.id}" data-tip="${esc(tip)}">${esc(m.title)}</button>`;
  };
  const updBtn=r=>{
    const u=(r.updates||[])[0];
    const tip=u?`Latest update · ${updMeta(u)}\n${u.text}\n\nClick to add an update`:"No updates yet\nClick to add an update";
    return `<button class="updbtn ${u?"has":""} ${updIsOpen(r,"rock")?"on":""}" data-act="addupd" data-kind="rock" data-id="${r.id}" aria-label="Add update" data-tip="${esc(tip)}">${ICONS.note}</button>`;
  };
  // two tables side by side: the rock column stays put, only the weeks scroll; row heights are synced in syncReviewRows()
  const rowCls=r=>`row ${r.status==="cancelled"?"cancelled":""}`;
  let left=rocks.map(r=>{
    const undated=r.milestones.filter(m=>!m.deadline).length;
    return `<tr class="${rowCls(r)}"><td class="rk"><div class="rkcell">
      <div class="rkhead">${ownerHTML(r.ownerId)}<button class="titlebtn" data-act="editrock" data-id="${r.id}"><span class="t">${esc(r.title)}</span></button>${teamTagHTML(r.unitId)}${trackTagsHTML(r)}${updBtn(r)}</div>
      <div class="rkmeta">${statusButtonHTML(r.status,`data-act="statusmenu" data-id="${r.id}"`)}${progressHTML(r)}${undated?`<span class="muted" style="font-size:12px">${undated} undated</span>`:""}${idsBtnHTML(r)}</div>
    </div></td></tr>`;
  }).join("");
  let right=rocks.map(r=>{
    const byWk={};
    r.milestones.forEach(m=>{if(m.deadline)(byWk[localISO(mondayOf(parseD(m.deadline)))]??=[]).push(m)});
    return `<tr class="${rowCls(r)}">${weeks.map(k=>`<td class="wkc ${k===nowWk?"now":""}">${(byWk[k]||[]).sort((a,b)=>a.deadline.localeCompare(b.deadline)).map(m=>chip(r,m)).join("")}</td>`).join("")}</tr>`;
  }).join("");
  if(!rocks.length){left=`<tr><td class="rk">${noRocksHTML("Add rocks in the Rocks tab.")}</td></tr>`;right=`<tr><td colspan="${weeks.length}"></td></tr>`}
  // the update popover lives outside the tables so it is never covered by the next row
  const openRock=updOpen?.kind==="rock"?rocks.find(r=>r.id===updOpen.id):null;
  const legend=legendHTML([["green","done"],["red","overdue"],["amber","due within 7 days"],["grey-fill","to do"]],"<span>· Click a milestone to mark it done</span>");
  return head+`<div class="board rrwrap"><table class="rr rr-left"><thead><tr><th class="rk">Rock</th></tr></thead><tbody>${left}</tbody></table>`
    +`<div class="scroll rr-scroll"><table class="rr rr-right">${cols}<tbody>${right}</tbody></table></div></div>`+legend+(openRock?updPopHTML(openRock,"rock"):"");
}
function syncReviewRows(){
  const L=$$(".rr-left tr"),R=$$(".rr-right tr");
  // ceil the fractional heights so both sides get the same whole-pixel height (rounding errors would add up down the list)
  const h=L.map((tr,i)=>Math.ceil(Math.max(tr.getBoundingClientRect().height,R[i]?R[i].getBoundingClientRect().height:0)));
  L.forEach((tr,i)=>{tr.style.height=h[i]+"px";if(R[i])R[i].style.height=h[i]+"px"});
}
function restoreReviewScroll(){
  const sc=$(".rr-scroll");if(!sc)return;
  if(rrScroll===null){const now=$("th.wk.now",sc);rrScroll=now?Math.max(0,now.offsetLeft-now.offsetWidth):0} // show one past week before the current one
  sc.scrollLeft=rrScroll;rrScroll=sc.scrollLeft;
}
/* Rock Review → IDS shortcut: the board being viewed, else the rock's own board; none if neither has one */
const idsTarget=r=>hasBoard(teamFilter)?teamFilter:hasBoard(r.unitId)?r.unitId:null;
function idsBtnHTML(r){
  const t=idsTarget(r);if(!t)return "";
  return `<button class="idsbtn" data-act="rock2ids" data-id="${r.id}" aria-label="Add to IDS" data-tip="${esc(`Add to the IDS list of ${unitName(t)}:\nRock Review: ${r.title}`)}">${ICONS.ids}</button>`;
}
function rockToIDS(r){
  const unitId=idsTarget(r),title=`Rock Review: ${r.title}`;if(!unitId)return;
  if(S.cards.some(c=>c.unitId===unitId&&c.column==="ids"&&c.title===title)){toast(`Already on the IDS list of ${unitName(unitId)}`);return}
  addCard("ids",title,unitId);toast(`Added to IDS · ${unitName(unitId)}`);
}

/* ---------- Level 10 (weekly meeting, per team or forum) ---------- */
function renderL10(){
  if(!hasBoard(teamFilter))return renderL10Pick();
  const cards=S.cards.filter(c=>c.unitId===teamFilter),open=cards.filter(c=>c.column!=="done").length;
  const head=`<div class="viewhead">${viewTitle("Level 10",teamFilter)}<span class="count">${plural(open,"open item")}</span></div>`;
  const agendaItem=([name,min,to,subs])=>{
    const inner=`<span class="an">${esc(name)}</span><span class="am ${min>=30?"big":""}">${min} min</span>`;
    const title=to==="review"?"Open Rock Review":`Show the ${colLabel(to)} column`;
    return `<li>${to?`<button class="ai lnk" data-act="agenda" data-to="${to}" title="${title}">${inner}</button>`:`<div class="ai">${inner}</div>`}
      ${subs?`<ul>${subs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</li>`;
  };
  const agenda=`<aside class="agenda" aria-label="Meeting agenda"><div class="agh"><h2>Agenda</h2><span class="muted">${AGENDA.reduce((s,a)=>s+a[1],0)} min</span></div><ol>${AGENDA.map(agendaItem).join("")}</ol></aside>`;
  const cardHTML=c=>{

// move a card to a column, before another card (or to the end of that column); order on the board = order in S.cards
function moveCard(id,column,beforeId){
  const c=card(id);if(!c||beforeId===id)return;
  const from=c.column;
  S.cards.splice(S.cards.indexOf(c),1);c.column=column;
  let i=beforeId?S.cards.findIndex(x=>x.id===beforeId):-1;
  if(i<0){i=S.cards.findLastIndex(x=>x.unitId===c.unitId&&x.column===column)+1;if(i===0)i=S.cards.length}
  S.cards.splice(i,0,c);
  if(from!==column)logHist(c,`Moved from ${colLabel(from)} to ${colLabel(column)}`);
  save();render();
  if(from!==column)toast(`Moved to ${colLabel(column)}`);
}

const stMenu={btn:null,onPick:null};

/* ---------- in-app confirmation dialog (window.confirm() is blocked in some embedded browsers) ---------- */
function askConfirm(msg,okLabel="Delete"){
  return new Promise(resolve=>{
    const bd=$("#cbackdrop");
    bd.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="c-msg" style="max-width:440px"><div class="body"><div id="c-msg" style="font-weight:600;font-size:14.5px">${esc(msg)}</div></div><footer><button class="btn" data-c="0">Cancel</button><button class="btn danger-solid" data-c="1">${esc(okLabel)}</button></footer></div>`;
    bd.classList.add("open");
    const done=v=>{bd.classList.remove("open");bd.onclick=null;document.removeEventListener("keydown",key,true);resolve(v)};
    const key=e=>{if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();e.stopImmediatePropagation();done(e.key==="Enter")}};
    document.addEventListener("keydown",key,true);
    bd.onclick=e=>{const c=e.target.closest("[data-c]");if(c)done(c.dataset.c==="1");else if(e.target===bd)done(false)};
    $('[data-c="0"]',bd).focus(); // default focus on Cancel so a stray Enter on the trigger doesn't delete
  });
}

/* ---------- modals ----------
   Every modal edits a working copy (modalState.obj) of the record (modalState.orig); Save writes it back and logs history.
   sync() copies the visible form fields into the working copy and is a no-op for fields that aren't rendered,
   so call it before every redraw. Closing with unsaved changes asks first. */
let modalState=null; // {kind:"goal"|"rock"|"card", obj, orig, isNew, tab, left, snapshot}
const MODALS={
  goal:{draw:()=>drawGoalModal(),sync:()=>syncGoalFields()},
  rock:{draw:()=>drawRockModal(),sync:()=>syncRockFields()},

const syncModal=()=>MODALS[modalState.kind].sync();
const drawModal=()=>MODALS[modalState.kind].draw();

}

function saveRock(){
  syncRockFields();

  r.title=r.title.trim();
  if(!r.title){if(!$("#f-title")){modalState.left="details";drawRockModal()}$("#f-title").focus();return}
  r.milestones=r.milestones.map(x=>({...x,title:x.title.trim()})).filter(x=>x.title);

  else{

    diffHist(o,r,{

      ownerId:(a,b)=>`Owner changed from ${a?personName(a):"none"} to ${b?personName(b):"none"}`,
      unitId:(a,b)=>`Team changed from ${unitName(a)} to ${unitName(b)}`,
      quarter:(a,b)=>`Moved from ${a} to ${b}`,

      goalId:(a,b)=>`Goal changed from ${gn(a)} to ${gn(b)}`,
      description:()=>"Description updated",
      deliverables:()=>"Deliverables updated",
    }).forEach(t=>logHist(r,t));
    forums().forEach(f=>{const was=(o.trackIn||[]).includes(f.id),now=r.trackIn.includes(f.id);if(was!==now)logHist(r,`${now?"Now":"No longer"} tracked in ${f.name}`)});
    if(r.updates.length>(o.updates||[]).length)logHist(r,"Posted an update");
    const before=new Map(o.milestones.map(x=>[x.id,x]));
    r.milestones.forEach(x=>{
      const b=before.get(x.id);
      if(!b)logHist(r,`Milestone “${x.title}” added`);else milestoneChanges(b,x).forEach(t=>logHist(r,t));
      before.delete(x.id);

    before.forEach(b=>logHist(r,`Milestone “${b.title}” removed`));

}

/* ---------- shared, searchable picker ----------
   Used for the top-bar team filter, the Team field of the goal and rock modals, "Linked to goal", "Contributes to goal" and card owners.
   groups() returns [{name, items:[{id, title, level|color, label?, indent?, search?}]}] in display order;
   get()/set() read and write the chosen id; display(id) is the text shown in the closed field;
   dotOf(id) (optional) gives the level whose colour is shown as a dot in the closed field. */
const pickerHTML=(id,{dot=false,hidden=null}={})=>`<div class="combo ${dot?"has-dot":""}" id="${id}">${dot?'<span class="cur-dot"></span>':""}<input id="${id}-in" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="${id}-list"><div class="list" id="${id}-list" role="listbox"></div>${hidden?`<input type="hidden" id="${hidden.id}" value="${esc(hidden.value)}">`:""}</div>`;
function initPicker(id,{get,set,groups,emptyText,display,dotOf,noun="items",allowNone=true,noneText="",placeholder=""}){ // noneText: shown (and listed) for the empty value instead of "— none —"
  const box=$("#"+id),inp=$(`#${id}-in`),list=$(`#${id}-list`);
  let active=-1,typed=false; // until the user types, the input shows the current value and must not act as a filter
  const setLabel=()=>{
    const v=get();
    inp.value=v?display(v):noneText;
    inp.placeholder=v||noneText?"":placeholder||(allowNone?"None — type to search":"Type to search");
    if(dotOf)$(".cur-dot",box).style.background=v?`var(--${dotOf(v).toLowerCase()})`:"transparent";
  };
  const draw=()=>{
    const q=typed?inp.value.trim().toLowerCase():"";
    const match=it=>!q||`${it.search||it.title} ${it.label||""}`.toLowerCase().includes(q);
    let html=q||!allowNone?"":`<div class="item ${!get()?"sel":""}" data-id="" role="option">${esc(noneText||"— none —")}</div>`,hits=0;
    groups().forEach(({name,items})=>{
      const its=items.filter(match);if(!its.length)return;hits+=its.length;
      html+=`<div class="grp">${esc(name)}</div>`+its.map(it=>`<div class="item ${it.id===get()?"sel":""}" data-id="${esc(it.id)}" role="option"${it.indent&&!q?` style="padding-left:${10+it.indent*18}px"`:""}><span class="dot" style="background:${it.color?esc(it.color):`var(--${it.level.toLowerCase()})`}"></span><span class="t">${esc(it.title)}</span><span class="lvl">${esc(it.label||"")}</span></div>`).join("");
    });
    if(!hits&&!q&&emptyText)html+=`<div class="none">${esc(emptyText())}</div>`;
    list.innerHTML=hits||!q?html:`<div class="none">No ${noun} match “${esc(inp.value)}”</div>`;
    active=-1;
  };
  const isOpen=()=>box.classList.contains("open");
  const open=()=>{box.classList.add("open");inp.setAttribute("aria-expanded","true");draw();$(".item.sel",list)?.scrollIntoView({block:"nearest"})};
  const close=()=>{box.classList.remove("open");inp.setAttribute("aria-expanded","false");typed=false;setLabel()};
  const pick=v=>{set(v||null);close()};
  inp.addEventListener("focus",()=>{typed=false;inp.select();open()});
  inp.addEventListener("mousedown",()=>{if(document.activeElement===inp&&!isOpen())open()});
  inp.addEventListener("input",()=>{typed=true;open()});
  inp.addEventListener("keydown",e=>{
    const its=$$(".item",list);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();if(!isOpen())open();
      active=Math.max(0,Math.min(its.length-1,active+(e.key==="ArrowDown"?1:-1)));
      its.forEach((it,i)=>it.classList.toggle("active",i===active));its[active]?.scrollIntoView({block:"nearest"});
    }
    else if(e.key==="Enter"){e.preventDefault();const it=its[active]||its.find(x=>x.dataset.id)||its[0];if(it)pick(it.dataset.id)}
    else if(e.key==="Escape"&&isOpen()){e.stopPropagation();close()}
  });
  list.addEventListener("mousedown",e=>{const it=e.target.closest(".item");if(!it)return;e.preventDefault();pick(it.dataset.id)});
  inp.addEventListener("blur",()=>setTimeout(()=>{if(box.offsetParent)close()},120)); // skip if the modal was closed (hidden) meanwhile
  setLabel();
  return {refresh:()=>{if(isOpen())draw();setLabel()}};
}
const byLevelTitle=(a,b)=>LEVELS.indexOf(goalLevel(a))-LEVELS.indexOf(goalLevel(b))||az(a,b);

   The value lives in a hidden #f-unit-id input that fires "change", so the modal code can read and watch it like a <select>. */
const unitItem=(u,indent=0)=>({id:u.id,title:u.name,level:levelOf(u.id),indent,label:indent?"":u.kind==="forum"?"Meeting":levelOf(u.id),search:`${u.name} ${u.parentId?unitName(u.parentId):""}`});

/* goal "Linked to": only higher-level goals of the same year, never the goal itself or its descendants.
   Team goal → its department's goals, Company, other departments. Department goal → Company. Company goal → nothing. */
function initLinkedPicker(g){
  const descendants=(id,acc=new Set())=>{S.goals.filter(x=>x.parentId===id).forEach(x=>{acc.add(x.id);descendants(x.id,acc)});return acc};
  const blocked=descendants(g.id);
  const unitId=()=>$("#f-unit-id").value,level=()=>levelOf(unitId());
  const allowed=x=>x.id!==g.id&&x.year===g.year&&!blocked.has(x.id)&&LEVELS.indexOf(goalLevel(x))<LEVELS.indexOf(level());
  const groups=()=>{
    const cand=S.goals.filter(allowed).sort(byLevelTitle),companyGoals=cand.filter(x=>goalLevel(x)==="Company");
    if(level()!=="Team")return [{name:company().name,goals:companyGoals}];
    const dept=deptOf(unitId()),depGoals=cand.filter(x=>goalLevel(x)==="Department");
    const others=depGoals.filter(x=>x.unitId!==dept).sort((a,b)=>unitName(a.unitId).localeCompare(unitName(b.unitId))||az(a,b));
    return [
      ...(dept?[{name:`${unitName(dept)} · your department`,goals:depGoals.filter(x=>x.unitId===dept)}]:[]),
      {name:company().name,goals:companyGoals},
      {name:"Other departments",goals:others,label:x=>unitName(x.unitId)},
    ];
  };
  const picker=initGoalPicker("f-parent",{get:()=>modalState.obj.parentId,set:v=>{modalState.obj.parentId=v},groups,
    emptyText:()=>level()==="Company"?`${company().name} goals are the top level, so they don't link to another goal.`:"No higher-level goals yet."});
  $("#f-unit-id").addEventListener("change",()=>{
    const lv=level(),pill=$("#f-level-pill");pill.className=`pill lvl-${lv}`;pill.textContent=`${lv} goal`;
    const p=goal(modalState.obj.parentId);if(p&&!allowed(p))modalState.obj.parentId=null; // e.g. became a Department goal while linked to a Department goal
    picker.refresh();
  });
}
/* rock "Contributes to goal": every goal of the rock's year, ordered by closeness to the rock's team:
   own team → own department → Company → own department's other teams → other departments */
function rockGoalGroups(unitId,year){
  const deptId=deptOf(unitId),used=new Set(),pool=S.goals.filter(g=>g.year===year);
  const take=gs=>gs.filter(g=>!used.has(g.id)).sort(byLevelTitle).filter(g=>used.add(g.id));
  const where=g=>isDept(g.unitId)?"Department":unitName(g.unitId); // shown on the right in the later groups
  const companyGroup=()=>({name:company().name,goals:take(pool.filter(g=>goalLevel(g)==="Company"))});
  const groups=[];
  if(unit(unitId)?.kind==="company")groups.push(companyGroup());
  else{
    const own=isDept(unitId)?"your department":isForum(unitId)?"this meeting":"your team";
    groups.push({name:`${unitName(unitId)} · ${own}`,goals:take(pool.filter(g=>g.unitId===unitId))});
    if(deptId&&deptId!==unitId)groups.push({name:`${unitName(deptId)} · your department`,goals:take(pool.filter(g=>g.unitId===deptId))});
    groups.push(companyGroup());
  }
  departments().sort((a,b)=>(b.id===deptId)-(a.id===deptId)).forEach(dep=>
    groups.push({name:dep.id===deptId?`${dep.name} · other teams`:dep.name,goals:take(pool.filter(g=>deptOf(g.unitId)===dep.id)),label:where}));
  groups.push({name:"Other",goals:take(pool),label:where}); // goals on a team outside the org structure
  return groups;
}
function initRockGoalPicker(r){
  const picker=initGoalPicker("f-goal",{get:()=>r.goalId,set:v=>{r.goalId=v},groups:()=>rockGoalGroups($("#f-unit-id").value,quarterYear($("#f-quarter").value))});
  $("#f-unit-id").addEventListener("change",picker.refresh);

/* ---------- rich text (card description) ----------
   Plain-text paste; pasted/dropped images are downscaled (≤1600px) and embedded as data URLs. Stored HTML always goes through sanitizeHTML(). */
function initRichText(el){
  const insertImage=(file,range)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const k=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement("canvas");
        cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        let url=cv.toDataURL("image/png");if(url.length>500000)url=cv.toDataURL("image/jpeg",.85); // PNG keeps text crisp; big photos go JPEG
        const node=document.createElement("img");node.src=url;
        if(range&&el.contains(range.startContainer)){
          range.deleteContents();range.insertNode(node);range.setStartAfter(node);range.collapse(true);
          const s=getSelection();s.removeAllRanges();s.addRange(range);
        }else el.appendChild(node);
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  };
  const curRange=()=>{const s=getSelection();return s.rangeCount&&el.contains(s.anchorNode)?s.getRangeAt(0).cloneRange():null};
  el.addEventListener("paste",e=>{
    const files=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile());
    e.preventDefault();
    if(files.length)files.forEach(f=>insertImage(f,curRange()));
    else document.execCommand("insertText",false,e.clipboardData.getData("text/plain")); // never paste foreign HTML
  });
  el.addEventListener("dragover",e=>{if([...e.dataTransfer.items].some(i=>i.kind==="file"))e.preventDefault()});
  el.addEventListener("drop",e=>{
    const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));if(!files.length)return;
    e.preventDefault();
    const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
    files.forEach(f=>insertImage(f,r));
  });
  el.addEventListener("click",e=>{if(e.target.tagName==="IMG")openLightbox(e.target.src)});
}
// keep only simple formatting and embedded raster images; everything else is unwrapped or dropped
function sanitizeHTML(html){
  const t=document.createElement("template");t.innerHTML=String(html||"");
  const OK=new Set(["DIV","P","BR","IMG","B","STRONG","I","EM","U","UL","OL","LI","SPAN"]),DROP=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","svg","SVG","MATH"]);
  const clean=n=>[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||DROP.has(c.tagName)){c.remove();return}
    clean(c);
    if(!OK.has(c.tagName)){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{if(!(c.tagName==="IMG"&&a.name==="src"))c.removeAttribute(a.name)});
    if(c.tagName==="IMG"&&!/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(c.getAttribute("src")||""))c.remove();
  });
  clean(t.content);
  const out=t.innerHTML.trim();
  return /^(<br>|<div><br><\/div>)?$/.test(out)?"":out;
}
function openLightbox(src){
  const lb=$("#lightbox");$("img",lb).src=src;lb.classList.add("open");
  const close=()=>{lb.classList.remove("open");document.removeEventListener("keydown",key,true)};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();close()}};
  document.addEventListener("keydown",key,true);lb.onclick=close;
}

/* ---------- tooltips (instant, from data-tip) ---------- */
const tip=$("#tip");let tipEl=null;
function showTip(el){
  const t=el.getAttribute("data-tip");if(!t)return;
  tip.textContent=t;tip.classList.add("show");
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=r.left,y=r.bottom+6;
  if(x+tw>innerWidth-8)x=innerWidth-tw-8;
  if(y+th>innerHeight-8)y=r.top-th-6;
  tip.style.left=x+"px";tip.style.top=y+"px";tipEl=el;
}
function hideTip(){tip.classList.remove("show");tipEl=null}

    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submitComposer()}else if(e.key==="Escape"){l10Add=null;render()}
  }
  else if(t.matches("[data-pop-text]")){ // quick-update popover: Enter posts, Esc closes
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();postQuickUpdate()}else if(e.key==="Escape")closeUpdPop();
  }
  else if(t.matches(".kcard")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();cardModal(card(t.dataset.card))}
  else if(t.matches("input.inline")&&e.key==="Enter")t.blur(); // commits via "change"
});
/* Level 10: drag cards between and within columns; a thin line shows where the card will land */
let dragId=null;
const dropMarker=document.createElement("div");dropMarker.className="kph";
$("#app").addEventListener("dragstart",e=>{
  const c=e.target.closest(".kcard");if(!c)return;
  dragId=c.dataset.card;hideTip();
  e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId);setTimeout(()=>c.classList.add("dragging"));
});
$("#app").addEventListener("dragover",e=>{
  const col=e.target.closest(".kcol");if(!col||!dragId)return;
  e.preventDefault();e.dataTransfer.dropEffect="move";
  const list=$(".klist",col),after=$$(".kcard:not(.dragging)",list).find(k=>{const r=k.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  after?list.insertBefore(dropMarker,after):list.appendChild(dropMarker);
});
$("#app").addEventListener("drop",e=>{
  const col=e.target.closest(".kcol");if(!col||!dragId)return;
  e.preventDefault();
  const before=dropMarker.nextElementSibling?.dataset.card||null,id=dragId;
  dragId=null;dropMarker.remove();moveCard(id,col.dataset.col,before);
});
$("#app").addEventListener("dragend",()=>{dragId=null;dropMarker.remove();$$(".kcard.dragging").forEach(k=>k.classList.remove("dragging"))});

$("#modal").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]"),fn=b&&MODAL_ACTIONS[b.dataset.m];if(fn)fn(b,b.dataset.id);
});
$("#modal").addEventListener("input",e=>{ // milestone fields in the rock modal
  const f=e.target.dataset.mf;if(!f||modalState?.kind!=="rock")return;
  const ms=modalState.obj.milestones.find(x=>x.id===e.target.dataset.id);if(!ms)return;
  ms[f]=e.target.value;
  if(f==="deadline"){const wrap=e.target.closest(".mdate");wrap.className=`mdate ${msDateCls(ms)}`;$("button",wrap).textContent=ms.deadline?fmtDate(ms.deadline):"Set date"}
});
$("#modal").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.matches(".msr input.mt")){ // milestone name: jump to the next one, or add one at the end
    e.preventDefault();
    const all=$$("#modal .msr input.mt"),i=all.indexOf(e.target);
    i<all.length-1?all[i+1].focus():addModalMilestone();
  }
  else if(e.target.id==="f-newupd"){e.preventDefault();MODAL_ACTIONS.updadd()}
});
$("#backdrop").addEventListener("click",e=>{if(e.target===e.currentTarget)requestCloseModal()});

$("#stmenu").addEventListener("click",e=>{
  const it=e.target.closest("[data-st]");if(!it)return;
  const pick=stMenu.onPick;closeStatusMenu(true);pick?.(it.dataset.st);
});
$("#stmenu").addEventListener("keydown",e=>{
  const its=$$("#stmenu .it"),i=its.indexOf(document.activeElement);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();its[(i+(e.key==="ArrowDown"?1:-1)+its.length)%its.length].focus()}
  else if(e.key==="Home"||e.key==="End"){e.preventDefault();its[e.key==="Home"?0:its.length-1].focus()}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeStatusMenu(true)}
  else if(e.key==="Tab")closeStatusMenu();
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalState)requestCloseModal()}); // pickers, menus and dialogs on top stop Escape first
document.addEventListener("mousedown",e=>{ // clicking outside closes the status menu and the quick-update popover
  if(stMenu.btn&&!e.target.closest("#stmenu")&&e.target.closest("[data-m='status'],[data-act='statusmenu']")!==stMenu.btn)closeStatusMenu();
  if(updOpen&&!e.target.closest("[data-pop]")&&!e.target.closest('[data-act="addupd"]'))closeUpdPop();
});
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el!==tipEl)el?showTip(el):hideTip()});
document.addEventListener("scroll",e=>{ // capture: also scrolls inside elements
  const el=e.target;
  hideTip();
  if(stMenu.btn&&!el.closest?.("#stmenu"))closeStatusMenu();
  if(el.classList?.contains("rr-scroll")){ // Rock Review: remember the position; a real scroll closes the popover (it is positioned to its button)
    if(Math.abs(el.scrollLeft-(rrScroll??0))<1)return;
    rrScroll=el.scrollLeft;closeUpdPop();
  }
  else if(el===document)closeUpdPop();
},true);
window.addEventListener("resize",()=>closeStatusMenu());
document.addEventListener("visibilitychange",()=>{ // a tab left open overnight: redraw when the date has changed
  if(document.hidden)return;
  const before=todayISO();refreshToday();if(todayISO()!==before)render();
});
$("#themeBtn").addEventListener("click",()=>{
  const next=isDark()?"light":"dark";document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  hideTip();drawThemeBtn();
});
darkMQ.addEventListener("change",drawThemeBtn); // OS switch while no choice is saved

/* ---------- init ---------- */
function init(){
  S=loadData();
  const p=loadPrefs();
  teamFilter=unit(p.teamFilter)?p.teamFilter:"";
  quarterFilter=quarterParts(p.quarter)?p.quarter:quarterOf(TODAY);
  planYear=Number.isInteger(p.planYear)?p.planYear:TODAY.getFullYear();
  drawThemeBtn();
  // team filter in the top bar (all views): same picker as the Team field, plus "All teams"
  $("#teamFilterWrap").innerHTML=`<label for="tf-in">Team</label>`+pickerHTML("tf",{dot:true});
  tfPicker=initPicker("tf",{get:()=>teamFilter,set:v=>{teamFilter=v||"";rrScroll=null;render()},groups:()=>unitGroups(true),display:unitName,dotOf:levelOf,noun:"teams",noneText:"All teams"});
  render();
  if(storageProblem)toast(storageProblem,6000);
}
init();
</script>
