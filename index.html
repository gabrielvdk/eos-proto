<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- published on GitHub Pages; keep it out of search engines -->
<title>EOS Tracker</title>
<!-- favicon = the top-bar logo (colours inlined: --green / --ink-3, CSS variables don't work in favicons) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27 fill=%27none%27%3E%3Cpath d=%27M4 18 L9 7 L14 13 L18 9 L23 18 Z%27 fill=%27%2319A974%27/%3E%3Cpath d=%27M2 20h22%27 stroke=%27%238A95A6%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#F3F5F9; --surface:#FFFFFF; --line:#E3E7EE; --line-strong:#C9D0DB;
  --ink:#1C2430; --ink-2:#5B6778; --ink-3:#8A95A6;
  --accent:#2F6FE4; --accent-soft:#E6EEFC;
  --green:#19A974; --green-deep:#0E7A5A; --green-soft:#DDF5EA;
  --red:#D93B4F; --red-deep:#A51E35; --red-soft:#FBE4E7;
  --amber:#E29A1C; --amber-soft:#FCF0D8;
  --grey-pill:#C7CDD7; --grey-fill:#8A95A6;
  --company:#5B4BDB; --department:#1F8FD1; --team:#19A974; --forum:#E2741C;
  --shadow:0 10px 30px rgba(28,36,48,.14);
  --radius:10px;
  --font-body:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  --font-title:"Titillium Web",Figtree,"Segoe UI",system-ui,sans-serif; /* titles only: app name, view h1, modal title (DESIGN.md §1) */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
    --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
    --accent:#6B9BFF; --accent-soft:#213353;
    --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
    --grey-pill:#3A4556; --grey-fill:#7D8898;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
  --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
  --accent:#6B9BFF; --accent-soft:#213353;
  --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
  --grey-pill:#3A4556; --grey-fill:#7D8898;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--ink);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:700;font-size:18px}
.brand svg{width:26px;height:26px}
/* environment tag next to the app name (Local / Mock API / test), signed-in user, save state */
.envtag{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--amber-soft);color:var(--amber);cursor:default}
.envtag.local{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line-strong)}
.envtag[hidden]{display:none}
.userbox .combo input{width:180px}
.userbox .uname{color:var(--ink);white-space:nowrap}
.savestate{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.savestate.bad{color:var(--red)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#fff}
.gated .tabs,.gated #teamFilterWrap{display:none}
/* Organisation tab (admins): org tree + people */
.tabn{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--amber);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.orgwrap{max-width:920px}
.mtabs.vtabs{padding:0;margin:-4px 0 14px;max-width:920px}
.orow .grip{display:inline-flex;color:var(--ink-3);cursor:grab;opacity:.45;flex:none;width:16px}
.orow .grip.off{cursor:default;opacity:0}
.orow .oname.ro{padding:4px 6px;flex:1 1 auto;min-width:80px}
.adminpill{background:var(--accent-soft);color:var(--accent)}
.orow:hover .grip:not(.off){opacity:1}
.orow .grip svg,.grip.inline svg{width:14px;height:14px}
.grip.inline{display:inline-flex;vertical-align:-2px;color:var(--ink-3)}
.orow.dragging{opacity:.35}
.opanel .kph{margin:0}
/* view only (items of teams you have no rights on) */
.stbtn.ro{display:inline-block;cursor:default;padding-right:11px}
.stbtn.ro::after{display:none}
.rkmeta .stbtn.ro{padding-right:9px}
.stbtn.ro:hover{filter:none}
.rotext{padding:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ronote{margin:0;padding:8px 10px;border-radius:8px;background:var(--canvas);color:var(--ink-2);font-size:12.5px}
.chip:disabled,.ms-toggle:disabled,.mdate button:disabled{cursor:default}
.chip:disabled:hover{box-shadow:none}
input.inline:disabled{color:inherit;cursor:default}
input.inline:disabled:hover{border-color:transparent}
.msr .rotitle{padding:5px 7px}
span.updbtn{cursor:default}
.opanel{padding:14px 16px 16px;display:grid;gap:4px}
.opanel h2{margin:0 0 6px;font-size:14px;font-weight:700}
.opanel h2.osub{margin-top:14px}
.onote{margin:0 0 8px;font-size:12.5px;color:var(--ink-2)}
.orow{display:flex;align-items:center;gap:8px;min-height:36px;padding-left:calc(var(--depth,0) * 22px)}
.orow .oname{flex:1 1 auto;min-width:80px}
.orow.company .oname,.orow.department .oname,.orow.forum .oname{font-weight:600}
.orow .ometa{font-size:12px;color:var(--ink-3);white-space:nowrap}
.orow .del{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:inline-flex;opacity:.55}
.orow:hover .del{opacity:1}
.orow .del:hover{color:var(--red);background:var(--red-soft)}
.orow .del svg{width:15px;height:15px}
select.ctl.sm{padding:3px 8px;font-size:12.5px;font-weight:500;border-radius:7px}
.prow{display:grid;grid-template-columns:auto minmax(130px,1fr) minmax(0,1.7fr) auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line)}
.prow.waiting{background:var(--amber-soft);border-radius:8px;border-top-color:transparent}
.pname{display:grid;min-width:0}
.pname span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punits{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ochip.uchip{padding-left:8px;font-weight:500}
@media (max-width:640px){.prow{grid-template-columns:auto 1fr}.punits,.prow .chkrow{grid-column:1/-1}}
.gate{max-width:560px;margin:48px auto;padding:24px 28px;display:grid;gap:10px}
.gate h1{font-family:var(--font-title);font-size:22px;margin:0}
.gate p{margin:0;color:var(--ink-2)}
.gate .row{display:flex;gap:8px;margin-top:6px}
.tabs{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(28,36,48,.12)}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-solid:hover{filter:brightness(1.07);background:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--canvas);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
select.ctl{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600}
select.ctl.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.checks{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);user-select:none}
.checks label:last-child{border-right:0}
.checks label:has(input:checked){color:var(--ink)}
.checks input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.checks .dot{width:7px;height:7px}
tr.ctx td{opacity:.45}
tr.ctx td .pill,tr.ctx td .dot{filter:grayscale(1)}

main{max-width:1280px;margin:0 auto;padding:22px 24px 72px} /* bottom room for the fixed theme toggle */
.topfilter{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2)}
.topfilter .combo input{width:220px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600;cursor:pointer}
.topfilter .combo input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft);cursor:text}
.topfilter .combo.active input{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.topfilter .combo .list{font-weight:400;color:var(--ink)}
#tip{position:fixed;z-index:40;max-width:360px;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;display:none;white-space:pre-line}
#tip.show{display:block}
main.wide{max-width:none}
.viewhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.viewhead h1{font-family:var(--font-title);font-size:22px;margin:0;font-weight:700}
.viewhead .count{color:var(--ink-3);font-weight:500}

/* tables */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
th.sortable .arr{display:inline-block;width:12px;margin-left:4px;color:var(--ink-3);font-size:11px}
th.sortable[aria-sort="ascending"] .arr::after{content:"▲";color:var(--accent)}
th.sortable[aria-sort="descending"] .arr::after{content:"▼";color:var(--accent)}
thead th{text-align:left;font-weight:700;color:var(--ink);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
tbody td{padding:0 12px;height:46px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row:hover td{background:color-mix(in srgb,var(--canvas) 60%,var(--surface))}
td.title{font-weight:400}
.titlebtn{border:0;background:none;padding:0;text-align:left;font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:8px;max-width:100%}
.titlebtn:hover{color:var(--accent)}
.titlebtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.cell-link{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chev{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;padding:0}
.chev svg{width:12px;height:12px;transition:transform .18s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev.leaf{visibility:hidden}
.chev.lone{visibility:visible;border-style:dashed;border-color:var(--line);background:transparent;cursor:default;pointer-events:none}
.chev.lone svg{display:none}
.addrow td{height:40px;color:var(--ink-3)}
.addrow button{border:0;background:none;color:var(--ink-3);font-weight:500;padding:0}
.addrow button:hover{color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lvl-Company{background:color-mix(in srgb,var(--company) 14%,transparent);color:var(--company)}
.lvl-Department{background:color-mix(in srgb,var(--department) 14%,transparent);color:var(--department)}
.lvl-Team{background:color-mix(in srgb,var(--team) 16%,transparent);color:var(--team)}
.pill.lvl-hidden{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)} /* a goal hidden behind a private meeting (DT Team only) */
.pill .ico-lock,.visrow .ico-lock{width:12px;height:12px;flex:none}
/* the goal "Visibility" switch: on = hidden behind a private meeting (red), off = everyone */
.visrow{display:inline-flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px;color:var(--ink-2)}
.visrow.on{color:var(--red);font-weight:600}
.visrow .vislabel{display:inline-flex;align-items:center;gap:6px}
.switch{position:relative;width:36px;height:20px;border-radius:999px;border:0;padding:0;background:var(--line-strong);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--red)}
.switch[aria-checked="true"]::after{left:18px}
.brtag{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--forum);background:color-mix(in srgb,var(--forum) 14%,transparent);border-radius:5px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.chkrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;justify-self:start}
.chkrow input{accent-color:var(--forum);width:14px;height:14px;margin:0}
.goalpill{background:var(--accent-soft);color:var(--accent)}
.teampill{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* status: coloured trigger button + custom menu (native <select> popups can't be styled on Windows) */
.st-not{background:var(--grey-pill)!important;color:var(--ink-2)!important}
.st-on{background:var(--green)!important}
.st-off{background:var(--red)!important}
.st-esc{background:var(--red-deep)!important}
.st-done{background:var(--green-deep)!important}
.st-can{background:repeating-linear-gradient(135deg,var(--grey-pill) 0 6px,color-mix(in srgb,var(--grey-pill) 70%,var(--surface)) 6px 12px)!important;color:var(--ink-2)!important}
.stbtn{position:relative;border:0;border-radius:7px;padding:5px 28px 5px 11px;font-weight:600;font-size:13px;min-width:132px;color:#fff;text-align:left;white-space:nowrap}
.stbtn.st-can{text-decoration:line-through}
.stbtn::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.8}
.stbtn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.stbtn:hover{filter:brightness(1.05)}
.field .stbtn{width:100%;padding-top:8px;padding-bottom:8px;border-radius:9px} /* status in the rock modal */
.stmenu{position:fixed;z-index:22;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:4px} /* above the modal backdrop (20), below the confirm dialog (25) */
.stmenu[hidden]{display:none}
.stmenu .it{display:grid;grid-template-columns:12px 1fr 16px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;text-align:left;font-size:13.5px;font-weight:500;color:var(--ink)}
.stmenu .it:hover,.stmenu .it:focus-visible{background:var(--canvas);outline:none}
.stmenu .it[aria-checked="true"]{font-weight:700}
.stmenu .it .sq{width:12px;height:12px;border-radius:4px}
.stmenu .it .ck{color:var(--accent);display:inline-flex}
.stmenu .it .ck svg{width:14px;height:14px}
.stmenu .sep{height:1px;background:var(--line);margin:4px 6px}
/* milestone toggle */
.ms-toggle{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 10px;font-weight:600;font-size:12.5px;color:var(--ink-2);min-width:68px}
.ms-toggle.done{background:var(--green);border-color:var(--green);color:#fff}

/* progress bar */
.prog{display:inline-flex;align-items:center;gap:8px}
.prog .bar{display:flex;height:16px;width:110px;border-radius:4px;overflow:hidden;background:var(--grey-pill)}
.prog .done{background:var(--green)}
.prog .over{background:var(--red)}
.prog.none .bar{background:transparent;border:1px dashed var(--line-strong)}

/* owner */
.owner{display:inline-flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* last update */
.lastupd{display:flex;align-items:center;gap:8px;min-width:0}
.lastupd .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:13px}
table.rocks{table-layout:auto}
table.rocks td.title,table.rocks th.fit,table.rocks td.fit{white-space:nowrap;width:1%}
table.rocks td.updcell{width:auto;min-width:220px;max-width:0}
table.rocks .treeline .titlebtn{flex:0 0 auto;min-width:0}
table.rocks .titlebtn .t{display:inline-block;max-width:420px;vertical-align:bottom}
.teamtag{font-size:11.5px;color:var(--ink-3);background:var(--canvas);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;font-weight:500;white-space:nowrap}
.lastupd .when{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.updbtn{border:0;background:none;color:var(--ink-3);padding:2px;border-radius:5px;display:inline-flex;flex:none}
.updbtn:hover{color:var(--accent);background:var(--accent-soft)}
.updbtn svg{width:16px;height:16px}
.updbtn.on{color:var(--accent);background:var(--accent-soft)}
td.updcell{position:relative}
.pop{position:fixed;z-index:8;width:320px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px}
.pop textarea{border:1px solid var(--line-strong);border-radius:8px;padding:8px;min-height:64px;resize:vertical;background:var(--surface);width:100%}
.pop textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pop .row{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.pop .pophead{font-size:12.5px;color:var(--ink-2)}
.pop .hint{font-size:11.5px;color:var(--ink-3);margin-right:auto}

/* milestones subtable */
tr.sub>td{padding:0;background:var(--canvas)}
.subwrap{padding:10px 12px 12px 48px;border-left:4px solid var(--green);margin-left:14px}
.subwrap table{min-width:0;table-layout:fixed;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.subwrap thead th{font-size:12px;padding:8px 10px;font-weight:700;background:var(--surface)}
.subwrap tbody td{height:40px;padding:0 10px;background:var(--surface)}
.subwrap tr.overdue td{background:var(--red-soft)}
.subwrap .del{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:inline-flex;opacity:.55}
.subwrap tr:hover .del{opacity:1}
.subwrap .del:hover{color:var(--red);background:var(--red-soft)}
.subwrap .del svg{width:15px;height:15px}
.subwrap tr.overdue .dl{color:var(--red);font-weight:600}
.dl{font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.soon{color:var(--amber)}
input.inline{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%}
input.inline:hover{border-color:var(--line-strong)}
input.inline:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.inline.date{width:auto}

/* tree */
.treeline{display:flex;align-items:center;gap:8px;min-width:0}
.treeline .titlebtn{min-width:0;flex:1 1 auto}
.treeline .titlebtn .t{display:block}
table.tree{table-layout:fixed}
table.tree tbody td{height:36px;padding-top:0;padding-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tree .cell-link{max-width:100%}
table.tree .cell-link span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.group td{height:30px;background:var(--canvas);color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding-left:12px;white-space:nowrap}
tr.group td .n{font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--ink-3)}
table.tree td.title{padding-left:calc(12px + var(--depth,0) * 20px)}
table.tree .chev{width:20px;height:20px}
table.tree .pill{padding:2px 9px;font-size:12px}

/* searchable nested combobox */
.combo{position:relative}
.combo input{width:100%;padding-right:30px!important;text-overflow:ellipsis}
.combo::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.combo.open::after{transform:translateY(-30%) rotate(225deg)}
.combo.has-dot input{padding-left:28px!important}
.combo .cur-dot{position:absolute;left:12px;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%);pointer-events:none}
#f-unit .list{left:0;right:auto}
.combo .list{position:absolute;left:auto;right:0;width:max(100%,380px);top:calc(100% + 4px);max-height:320px;overflow-y:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);z-index:9;display:none;padding:4px}
.combo.open .list{display:block}
.combo .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.combo .item:hover,.combo .item.active{background:var(--accent-soft)}
.combo .item.sel{font-weight:600}
.combo .item.dis{color:var(--ink-3);cursor:default}
.combo .item.dis:hover{background:transparent}
.combo .item .t{flex:1 1 auto;min-width:0}
.combo .item .lvl{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;padding-left:8px}
.combo .none{padding:8px 10px;color:var(--ink-3);font-size:13px}
.combo .grp{padding:9px 10px 3px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.grid12{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:640px){.grid12{grid-template-columns:1fr}}
.mtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.hist{display:grid;gap:0}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.hist .h:last-child{border-bottom:0}
.hist .h .what{font-size:13.5px}
.hist .h .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(14,18,26,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:880px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--font-title);font-size:20px;font-weight:700;flex:1}
.modal .body{padding:18px 20px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end}
.field{display:grid;gap:5px;align-content:start} /* keep label + control at the top when a neighbouring field is taller */
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field>label .pill{padding:0 8px;line-height:18px;font-size:11.5px;vertical-align:top} /* a pill in a label (e.g. "Company goal") keeps the label one line high, so fields side by side line up */
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.modal.wide{max-width:1320px} /* Full HD: room for the form and the updates side by side */
.twocol{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
.twocol>.main{border-right:1px solid var(--line);min-width:0}
.twocol>.main>.body{min-height:440px;align-content:start}
/* milestone list in the rock modal */
.msl{display:grid;gap:2px}
.msr{display:grid;grid-template-columns:22px minmax(0,1fr) auto 26px;align-items:center;gap:8px;padding:3px 4px 3px 6px;border-radius:8px}
.msr:hover,.msr:focus-within{background:var(--canvas)}
.mck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:transparent;padding:0}
.mck:hover{border-color:var(--green);color:var(--green)}
.mck svg{width:12px;height:12px}
.msr.done .mck{background:var(--green);border-color:var(--green);color:#fff}
.msr input.mt{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;width:100%}
.msr input.mt:hover{border-color:var(--line-strong);background:var(--surface)}
.msr input.mt:focus{border-color:var(--accent);background:var(--surface);outline:none}
.msr.done input.mt{text-decoration:line-through;color:var(--ink-2)}
.mdate{position:relative;display:inline-flex}
.mdate button{border:0;background:var(--canvas);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:62px}
.msr:hover .mdate button,.msr:focus-within .mdate button{background:var(--surface)}
.mdate button:hover{color:var(--accent)}
.mdate.empty button{color:var(--ink-3);font-weight:500}
.mdate.over button{color:var(--red);background:var(--red-soft)}
.mdate.soon button{color:var(--amber)}
.mdate input{position:absolute;left:0;bottom:0;width:100%;height:0;opacity:0;pointer-events:none;border:0;padding:0}
.msr .x{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:inline-flex;opacity:0}
.msr:hover .x,.msr:focus-within .x{opacity:1}
.msr .x:hover{color:var(--red);background:var(--red-soft)}
.msr .x svg{width:15px;height:15px}
.twocol>.side{display:flex;flex-direction:column;min-height:0}
.side .mtabs{padding:0 20px}
.side .pane{padding:16px 20px;display:grid;gap:10px;align-content:start;max-height:calc(100vh - 300px);overflow:auto}
@media (max-width:860px){.twocol{grid-template-columns:1fr}.twocol>.main{border-right:0;border-bottom:1px solid var(--line)}.twocol>.main>.body{min-height:0}}
.updates{display:grid;gap:8px;max-height:220px;overflow:auto}
.upd{display:grid;gap:2px;padding:8px 10px;border-radius:9px;background:var(--canvas)}
.upd .meta{font-size:11.5px;color:var(--ink-3)}
.addupd{display:flex;gap:8px}
.addupd input{flex:1;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.legend{display:flex;gap:14px;align-items:center;color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* level 10: agenda + kanban board */
.l10{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:stretch;height:calc(100vh - var(--l10top,160px) - 72px);min-height:560px} /* fills the screen; lists scroll inside (--l10top: set in render) */
@media (max-width:980px){.l10{grid-template-columns:1fr}}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px}
.l10side{display:flex;flex-direction:column;gap:12px;min-height:0}
.l10side .agenda{flex:none}
.boardpeople{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column}
.boardpeople .plist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto}
.boardpeople .plist li{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:13px}
.boardpeople .plist .avatar{width:22px;height:22px;font-size:10px}
.boardpeople .who{margin:6px 6px 4px;font-size:12px;color:var(--ink-3)}
.agh{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.agh h2{margin:0;font-size:14px;font-weight:700}
.agenda ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
.agenda .ai{display:flex;align-items:baseline;gap:8px;width:100%;padding:7px 6px;border:0;background:none;border-radius:8px;text-align:left;font-size:13.5px;color:var(--ink)}
.agenda .an{flex:1}
.agenda .am{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.agenda .am.big{color:var(--ink);font-weight:700}
.agenda .lnk{font-weight:600}
.agenda .lnk:hover{background:var(--accent-soft);color:var(--accent)}
.agenda ul{margin:0 0 4px;padding:0 0 0 22px;font-size:12.5px;color:var(--ink-2)}
.agenda ul li{padding:1px 0}
.agenda ul li::marker{color:var(--amber)}
.kboard{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px;overflow-x:auto;align-items:stretch;min-height:0}
.kcol{background:color-mix(in srgb,var(--line) 45%,var(--canvas));border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;border-top:3px solid var(--grey-fill);transition:box-shadow .3s}
.kcol.k-ids{border-top-color:var(--amber)} .kcol.k-todo{border-top-color:var(--accent)} .kcol.k-done{border-top-color:var(--green)}
.kcol.flash{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.kcol header{display:flex;align-items:center;gap:8px;padding:0 4px}
.kcol h2{margin:0;font-size:13.5px;font-weight:700}
.kcol header .n{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface);border-radius:999px;padding:0 7px}
.klist{display:flex;flex-direction:column;gap:8px;min-height:30px;flex:1 1 auto;overflow-y:auto;margin:0 -4px;padding:2px 4px} /* scrolls inside the column */
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(28,36,48,.07);display:grid;gap:6px}
.kcard:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(28,36,48,.1)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.35}
.kcard .kt{font-size:13.5px;overflow-wrap:anywhere}
.k-done .kcard .kt{color:var(--ink-2);text-decoration:line-through}
.kmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);min-height:22px}
.kmeta>span:not(.own){display:inline-flex;align-items:center;gap:3px}
.kmeta svg{width:14px;height:14px}
.kmeta .own{margin-left:auto;display:flex;padding-left:5px}
.kmeta .own .avatar{width:22px;height:22px;font-size:10px;margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.kmeta .noown{font-size:11.5px;color:var(--amber);font-weight:600}
.kph{height:3px;border-radius:2px;background:var(--accent);margin:-2px 0}
.kadd{border:0;background:none;color:var(--ink-2);padding:7px 6px;font-weight:600;text-align:left;border-radius:8px}
.kadd:hover{background:var(--surface);color:var(--ink)}
.kcompose{display:grid;gap:6px}
.kcompose textarea{width:100%;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;resize:none;min-height:60px;background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.kcompose .row{display:flex;gap:6px}
.l10pick{padding:20px 22px;display:grid;gap:14px}
.l10pick p{margin:0;color:var(--ink-2)}
.pdept .grp{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pteams{display:flex;flex-wrap:wrap;gap:8px}
.pteam{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.pteam:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pteam .n{font-size:11.5px;font-weight:600;color:var(--ink-3)}
/* card modal */
.colseg{display:flex;width:100%}
.colseg button{flex:1;white-space:nowrap;padding:7px 8px}
.owners{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.ochip{display:inline-flex;align-items:center;gap:6px;background:var(--canvas);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 2px;font-size:12.5px;font-weight:600}
.ochip .avatar{width:20px;height:20px;font-size:9.5px}
.ochip button{border:0;background:none;color:var(--ink-3);width:18px;height:18px;border-radius:50%;padding:0;line-height:1}
.ochip button:hover{background:var(--red-soft);color:var(--red)}
.rte{min-height:120px;max-height:45vh;overflow:auto;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;background:var(--surface);overflow-wrap:anywhere;white-space:pre-wrap}
.rte:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rte:empty::before{content:attr(data-placeholder);color:var(--ink-3)}
.rte img{display:block;max-width:100%;max-height:260px;border-radius:6px;border:1px solid var(--line);margin:6px 0;cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:26;background:rgba(14,18,26,.8);display:none;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow);background:#fff}

/* scorecard (a spreadsheet: every cell is an input). Like Rock Review: two tables side by side, measurable · who · goal
   stay put (.sc-left) and only the weeks scroll (.sc-right inside .sc-scroll); rows are synced in fitScorecard */
.scwrap{display:flex;align-items:flex-start}
.scwrap .sc-scroll{flex:1 1 auto;min-width:0}
table.sc{border-collapse:separate;border-spacing:0;width:max-content;font-variant-numeric:tabular-nums}
table.sc.sc-left{flex:none;border-right:1px solid var(--line-strong)}
table.sc th,table.sc td{padding:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);height:auto;background:var(--surface)}
table.sc th:first-child,table.sc td:first-child{border-left:0}
table.sc thead th{height:52px;padding:8px 10px;text-align:left;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--canvas);vertical-align:bottom}
table.sc thead th.c-wk{text-align:right;line-height:1.25}
table.sc thead th.c-wk b{display:block;color:var(--ink);font-size:13px}
table.sc thead th.c-wk span{font-weight:500;color:var(--ink-3)}
table.sc thead th.c-wk.cur{background:var(--accent)}
table.sc thead th.c-wk.cur b,table.sc thead th.c-wk.cur span{color:#fff}
table.sc thead th.c-wk.fut b{color:var(--ink-3)}
table.sc td.c-wk.cur{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
table.sc td.c-wk.fut{background:color-mix(in srgb,var(--canvas) 60%,var(--surface))}
table.sc .c-title{width:400px;min-width:400px;max-width:400px}
table.sc .c-who{width:52px;min-width:52px;text-align:center}
table.sc .c-goal{width:120px;min-width:120px;max-width:120px}
table.sc .c-wk{width:var(--scw,104px);min-width:var(--scw,104px);max-width:var(--scw,104px)}
table.sc tbody tr:last-child td{border-bottom:0}
.sct{display:flex;align-items:center;gap:4px;padding-right:6px}
.sct .scc{flex:1;min-width:0}
.sct .teamtag,.sct .brtag{flex:none}
.scwho{position:relative;display:flex;align-items:center;justify-content:center;height:36px}
.scwho .avatar{width:26px;height:26px;font-size:10.5px}
.scwho .avatar.none{background:none;border:1.5px dashed var(--line-strong);color:var(--ink-3);font-size:13px;font-weight:600}
.scwho select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font:inherit} /* invisible, on top of the avatar: a click opens the list */
.scwho select:disabled{cursor:default}
.scwho:focus-within .avatar{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.scwho:hover .avatar.none{border-color:var(--accent);color:var(--accent)}
.schelp{display:inline-flex;align-items:center;gap:5px;cursor:help}
.schelp i{font-style:normal;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--ink-2);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center}
.scc{display:block;width:100%;border:0;margin:0;padding:9px 10px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;outline:none;cursor:cell;text-overflow:ellipsis}
.c-wk .scc,.c-goal .scc{text-align:right}
.c-title .scc{font-weight:600;padding-left:4px}
.scc:focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface);cursor:text;position:relative;z-index:1}
.scc[readonly]:focus{box-shadow:inset 0 0 0 2px var(--line-strong)}
.scc.ok{background:var(--green-soft);color:var(--green-deep)}
.scc.bad{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.scc.badgoal{color:var(--amber);text-decoration:underline dotted}
.scc::placeholder{color:var(--ink-3);font-weight:500}
:root[data-theme="dark"] .scc.ok{color:var(--green)}
:root[data-theme="dark"] .scc.bad{color:#FF8A98}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scc.ok{color:var(--green)}:root:not([data-theme="light"]) .scc.bad{color:#FF8A98}}
.scnew td{background:var(--canvas)!important}
.scnew .c-title .scc{font-weight:500}
.scgrip{flex:none;display:inline-flex;width:20px;justify-content:center;color:var(--ink-3);opacity:.35;cursor:grab;padding:2px 0;margin-left:4px;border-radius:4px}
.scgrip svg{width:14px;height:14px}
.scgrip.off{cursor:default}
tr:hover .scgrip:not(.off){opacity:1}
.scgrip:not(.off):hover{background:var(--canvas);color:var(--ink)}
.sct .idsbtn,.scdots{flex:none;border:0;background:none;color:var(--line-strong);padding:3px;border-radius:5px;display:inline-flex}
.sct .idsbtn svg{width:16px;height:16px}
.scdots{color:var(--ink-3);opacity:0}
.scdots svg{width:16px;height:16px}
tr:hover .scdots,.scdots:focus-visible,.scdots.on{opacity:1}
.sct .idsbtn:hover,.sct .idsbtn.on,.scdots:hover,.scdots.on{color:var(--accent);background:var(--accent-soft)}
.scmenu{width:auto;min-width:220px;padding:6px;gap:0}
.scmenu .it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;text-align:left;font:inherit;font-size:13.5px;color:var(--ink)}
.scmenu .it:hover{background:var(--canvas)}
.scmenu .it .ck{width:16px;display:inline-flex;justify-content:center;color:var(--accent);font-weight:700}
.scmenu .it .ck svg{width:14px;height:14px}
.scmenu .it.danger,.scmenu .it.danger .ck{color:var(--red)}
.scmenu .sep{height:1px;background:var(--line);margin:4px 2px}
table.sc tr.dragging td{opacity:.45}

<script>
/* EOS Tracker — one file, no build step (the optional server lives in api/, see docs/AZURE.md). Sections, in order:
   constants · ids & dates · session · data model & sample data · migration · backends (local / mock / api) · ui state · helpers ·
   shared renderers · views (plan, rocks, rock review, level 10) · render() · status menu · confirm dialog ·
   modals (goal, rock, card) · pickers · rich text · events · init */

/* ---------- constants ---------- */
const LEVELS=["Company","Department","Team"]; // goal levels, top-down; a goal's level follows from its unit (levelOf)
const STATUSES=[ // rock statuses: the key is stored, the label is shown
  {key:"not_set",  label:"Not Set",       cls:"st-not"},
  {key:"on_track", label:"On-Track",      cls:"st-on"},
  {key:"off_track",label:"Off-Track",     cls:"st-off"},
  {key:"escalate", label:"OT - Escalate", cls:"st-esc"},
  {key:"done",     label:"Done",          cls:"st-done"},
  {key:"cancelled",label:"Cancelled",     cls:"st-can"},
];
const COLS=[{key:"ids",label:"IDS"},{key:"todo",label:"To Do"},{key:"done",label:"Done"}]; // Level 10 board columns
const AGENDA=[ // Level 10 agenda: [name, minutes, link, sub-items]; link = "review" / "scorecard" (the tab) or a board column
  ["Segue",5],["Scorecard",5,"scorecard"],["Rock Review",5,"review"],["Customer / Employee Headlines",5],
  ["To-Do List",5,"todo"],["IDS",60,"ids"],["Conclude",5,null,["Recap To-Do List","Cascading Messages","Rating (1–10)"]],
];
const UNIT_LEVEL={company:"Company",department:"Department",team:"Team",forum:"Forum"}; // "Forum" only colours dots; goals never belong to a forum

/* ---------- ids & dates ---------- */
const uid=()=>globalThis.crypto?.randomUUID?.()??`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
const pad2=n=>String(n).padStart(2,"0");
const localISO=dt=>`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; // toISOString() would give yesterday east of UTC
let TODAY; // local midnight; refreshed by render() so a tab left open overnight moves on
function refreshToday(){const t=new Date();t.setHours(0,0,0,0);TODAY=t}
refreshToday();
const todayISO=()=>localISO(TODAY);
const nowStamp=()=>new Date().toISOString(); // when something happened (history, updates, created)
const parseD=s=>new Date(s+"T00:00:00"); // a calendar date (deadline) at local midnight
const stampDay=s=>!s?"":s.length<=10?s:localISO(new Date(s)); // older data stores plain dates instead of timestamps
const fmtDate=s=>s?parseD(stampDay(s)).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const fmtStamp=s=>!s||s.length<=10?fmtDate(s):`${fmtDate(s)}, ${new Date(s).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`;
const isPast=s=>!!s&&parseD(s)<TODAY;
const isSoon=s=>{if(!s)return false;const days=(parseD(s)-TODAY)/864e5;return days>=0&&days<=7};
const mondayOf=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const isoWeek=dt=>{const x=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));return Math.ceil(((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5+1)/7)};
const quarterOf=dt=>`Q${Math.floor(dt.getMonth()/3)+1} ${dt.getFullYear()}`;
const quarterParts=q=>{const m=/^Q([1-4]) (\d{4})$/.exec(q||"");return m?{n:+m[1],year:+m[2]}:null};
const quarterYear=q=>quarterParts(q)?.year??TODAY.getFullYear();
const quarterSortKey=q=>{const p=quarterParts(q);return p?p.year*4+p.n:0};
const quarterRange=q=>{const {n,year}=quarterParts(q);return [new Date(year,(n-1)*3,1),new Date(year,n*3,0)]};

/* ---------- session ----------
   Who is using the app, set by the backend when it loads: on Azure the signed-in Microsoft account (its person record),
   locally a person picked in the top bar (simulated sign-in). Everything that records an author reads currentUserId(). */
const session={userId:"p1"};
const currentUserId=()=>session.userId;

/* ---------- data model ----------
   All shared data lives in one object S (one per organisation; later: the database).
   S = {version, people, units, goals, rocks, cards, measurables}
   people  [{id, name, color, email, unitIds:[unit id], admin}]   on Azure everyone who signs in is added automatically
           (matched on email), without units. Role (roleOf): admin = admin:true or in the server's ADMIN_EMAILS ·
           member = belongs to at least one unit · pending = neither: sees a "wait to be added to a team" page, nothing else.
           Only admins change people and units (Organisation tab); the server enforces this.
   units   [{id, kind:"company"|"department"|"team"|"forum", name, parentId, rank}]
           A team's parentId is its department; other units have none. A department without teams acts as its own team (HR).
           A forum is a meeting (Business Review) that acts like a team for rocks and Level 10, but has no goals;
           it also has {includeTracked, includeEscalated}: show rocks tracked in it / rocks with status "escalate".
   goals   [{id, unitId, year, title, parentId, visibleTo, description, deliverables, history}]   level = levelOf(unitId);
           visibleTo = a private meeting's id: only its members see the goal (company goals default to it)
   rocks   [{id, unitId, quarter:"Q4 2026", rank, title, ownerId, status (STATUSES key), goalId, trackIn:[forum id],
             description, deliverables, milestones:[{id, title, done, deadline:"YYYY-MM-DD", updates}], updates, history}]
   cards   [{id, unitId, column (COLS key), rank, title, description (sanitized HTML), owners:[person id], createdBy, createdAt, updates, history}]
   measurables [{id, unitId, rank, title, ownerId, goal:"20+" (text, see parseGoal), values:{"YYYY-MM-DD" (a Monday): number}, history}]
           the Scorecard: one row per measurable, on teams and meetings (like the Level 10 board)
   rank: display order (S.rocks, S.cards and S.measurables are kept sorted by it); a database keeps no array order.
   updates and history: [{at, who, text}], newest first; `at` is an ISO timestamp (older entries: a plain date, older updates: no `who`).
   Records refer to each other by id, never by name. */

/* ---------- sample data (only used when this browser has no saved data) ---------- */

    ["Product & Technology",["Data Science","Research","LG Dev","IIVO Dev","Hardware","Controls"]],

  add("forum","Business Review",null,{includeTracked:true,includeEscalated:true}); // every 4 weeks, team leaders
  return units;
}

/* ---------- migration ----------
   Brings data of any older shape up to DATA_VERSION. It runs on every load in every backend; on Azure the first visit
   after a deploy writes the migrated records back, so a shape change never needs a manual step.
   When the shape changes: bump DATA_VERSION and add a step here. */
function migrate(data){
  if(!data.version)data=migrateV7(data); // → 8
  if(data.version<9)data=migrateV8(data); // → 9
  if(data.version<10)data=migrateV9(data); // → 10
  if(data.version<11)data=migrateV10(data); // → 11
  if(data.version<12)data=migrateV11(data); // → 12
  return data;
}
// v7 and older: units referenced by name, stored goal levels, status labels, a single trackBR flag, no authors on updates
function migrateV7(old){
  const units=[],idByName=new Map();
  const add=(kind,name,parentId=null,extra={})=>{const u={id:uid(),kind,name,parentId,...extra};units.push(u);idByName.set(name,u.id);return u};
  add("company","Hoogendoorn");
  (old.departments||[]).forEach(dep=>{const u=add("department",dep.name);dep.teams.filter(t=>t!==dep.name).forEach(t=>add("team",t,u.id))}); // a team named like its department is the department
  const hadForums=!!old.forums;
  (old.forums||[{name:"Business Review",includeTracked:true,includeEscalated:true}])
    .forEach(f=>add("forum",f.name,null,{includeTracked:!!f.includeTracked,includeEscalated:!!f.includeEscalated}));
  const unitId=name=>{ // names outside the org structure become teams without a department
    if(name==="Company")name="Hoogendoorn"; // the company unit's old name
    if(!idByName.has(name))add("team",name);
    return idByName.get(name);
  };
  const statusKey=label=>label==="Off-Track Escalate"?"escalate":(STATUSES.find(s=>s.label===label)||STATUSES[0]).key;
  const forumId=units.find(u=>u.kind==="forum")?.id;
  const goals=(old.goals||[]).map(({level,team,...g})=>({...g,unitId:unitId(team),year:2026})); // v7 had one hard-coded year
  const rocks=(old.rocks||[]).map(({team,trackBR,...r})=>{
    const tracked=trackBR||(!hadForums&&(r.id==="r3"||r.id==="r19")); // the sample rocks were tracked when forums were added
    return {...r,unitId:unitId(team),status:statusKey(r.status),trackIn:tracked&&forumId?[forumId]:[]};
  });
  const cards=(old.cards||[]).map(({team,...c})=>({...c,unitId:unitId(team)}));
  return {version:8,people:old.people||[],units,goals,rocks,cards};
}
// v8: order was the array order; rocks and cards get an explicit rank (a database keeps no order)
function migrateV8(data){
  data.rocks.forEach((r,i)=>{r.rank??=i});
  data.cards.forEach((c,i)=>{c.rank??=i});
  return {...data,version:9};
}
/* v9: no team membership or admins yet. Existing people keep access: they join the units of the rocks and cards they own
   (else the company). Data that was never on Azure (no e-mail addresses) makes its first person admin, so someone can manage it;
   on Azure the admins come from ADMIN_EMAILS. Units get a rank (their order). */
function migrateV9(data){
  const company=data.units.find(u=>u.kind==="company");
  data.units.forEach((u,i)=>{u.rank??=i});
  data.people.forEach(p=>{
    if(p.unitIds)return;
    const owned=[...data.rocks.filter(r=>r.ownerId===p.id),...data.cards.filter(c=>(c.owners||[]).includes(p.id))].map(x=>x.unitId);
    p.unitIds=[...new Set(owned)];
    if(!p.unitIds.length&&company)p.unitIds=[company.id];
  });
  if(data.people.length&&!data.people.some(p=>p.admin)&&!data.people.some(p=>p.email))data.people[0].admin=true;
  return {...data,version:10};
}
/* v10: rocks and Level 10 cards could sit on the company or a department; they now live on teams and meetings only.
   Each department (or the company) that had some gets a "<name> MT" team (management team), listed first, and they move
   there. Its people keep their rights: rights flow down from the department (or company) to the new team. */
function migrateV10(data){
  const mt=new Map(); // department/company id → its MT team id
  const mtFor=u=>{
    if(mt.has(u.id))return mt.get(u.id);
    const parentId=u.kind==="department"?u.id:null,name=`${u.name} MT`;
    let team=data.units.find(t=>t.kind==="team"&&t.name===name&&(t.parentId||null)===parentId);
    if(!team){
      const siblings=data.units.filter(t=>t.kind==="team"&&(t.parentId||null)===parentId);
      team={id:uid(),kind:"team",name,parentId,rank:siblings.length?Math.min(...siblings.map(t=>t.rank??0))-1:nextRank(data.units)};
      data.units.push(team);
    }
    mt.set(u.id,team.id);return team.id;
  };
  const byId=new Map(data.units.map(u=>[u.id,u]));
  for(const x of [...data.rocks,...data.cards]){
    const u=byId.get(x.unitId);
    if(u&&(u.kind==="department"||u.kind==="company"))x.unitId=mtFor(u);
  }
  return {...data,version:11};
}
const byRank=(a,b)=>(a.rank??0)-(b.rank??0);
const nextRank=list=>list.reduce((m,x)=>Math.max(m,x.rank??0),-1)+1;
// v11: the Scorecard (measurables) arrives; the sample data (recognisable by its short ids) gets the sample scorecards
function migrateV11(data){
  let measurables=data.measurables||[];
  if(!measurables.length&&data.goals.some(g=>g.id==="g1")){
    const U=name=>data.units.find(u=>u.name===name)?.id;
    measurables=seedMeasurables(U).filter(m=>m.unitId);
  }
  return {...data,measurables,version:12};
}
function prepareData(data){data.units.sort(byRank);data.rocks.sort(byRank);data.cards.sort(byRank);data.measurables.sort(byRank);return data}

/* ---------- backends ----------
   Where the data lives. Every backend fills S and the session on load() and stores changes on save().
   - local: this browser's localStorage. No server; sign-in is simulated (pick a person in the top bar).
            Used whenever there is no API: double-click, serve.ps1, GitHub Pages. For development with fake data.
   - api:   Azure Static Web Apps + Functions + Cosmos DB with Microsoft sign-in (docs/AZURE.md). Used when /api/config answers.
   - mock:  the real API code (api/src/core.js) running inside the browser on a localStorage "database", to try the
            API path without Azure. Open with ?backend=mock (add &as=name@example.com to be someone else).
   ?backend=local forces local mode. Personal view settings (prefs, theme) always stay in this browser. */
const DATA_KEY="eos-tracker-data";
const LEGACY_DATA_KEY="goals-rocks-v7"; // pre-v8 data, moved to DATA_KEY on first load
const MOCK_DB_KEY="eos-tracker-mock-db";
const PREFS_KEY="eos-tracker-prefs";
const THEME_KEY="eos-theme";
let S;       // all shared data (see "data model")
let backend; // localBackend or a remote backend (api / mock)
const save=()=>backend.save(); // call after every change to S

/* local: localStorage */
let storageProblem=null; // set when saving must not happen (unreadable data) or failed while moving old data
const localBackend={
  kind:"local",
  async load(){
    S=prepareData(readLocalData());refreshRights();
    const me=loadPrefs().fakeUserId;
    session.userId=S.people.some(p=>p.id===me)?me:(S.people[0]?.id??"p1");
    return S;
  },
  save(){
    if(storageProblem){toast(storageProblem,5000);return false}
    try{localStorage.setItem(DATA_KEY,JSON.stringify(S));return true}
    catch(e){toast("Not saved: browser storage is full. Remove some pasted images.",5000);return false} // ~5 MB per site; screenshots use most of it
  },
  pending:()=>false,
};
function readLocalData(){
  let raw=null,legacy=false;
  try{raw=localStorage.getItem(DATA_KEY);if(!raw){raw=localStorage.getItem(LEGACY_DATA_KEY);legacy=!!raw}}catch(e){} // storage blocked: run on sample data
  if(!raw)return seed();
  let data;
  try{data=migrate(JSON.parse(raw))}
  catch(e){
    console.error("Saved data could not be read",e);
    storageProblem="Not saved: the data saved in this browser couldn't be read, so it is left untouched."; // never overwrite it
    return seed();
  }
  if(legacy&&!moveLegacyData(data))storageProblem="Not saved: browser storage is full. Remove some pasted images.";
  return data;
}
function moveLegacyData(data){ // returns false when the new copy can't be stored (then the old one stays)
  const json=JSON.stringify(data);
  try{localStorage.setItem(DATA_KEY,json);localStorage.removeItem(LEGACY_DATA_KEY);return true}catch(e){}
  const old=localStorage.getItem(LEGACY_DATA_KEY); // no room for two copies: free the old one first, put it back if that fails too
  localStorage.removeItem(LEGACY_DATA_KEY);
  try{localStorage.setItem(DATA_KEY,json);return true}
  catch(e){localStorage.setItem(LEGACY_DATA_KEY,old);return false}
}

/* api and mock: the same backend, only the transport differs (HTTP to /api, or the API core inside the browser).
   save() compares every record with the copy last stored and sends only what changed, each with its ETag, so a change
   someone else made in the meantime is detected (412: reload, your change is dropped) instead of silently overwritten. */
const SYNCED=["people","units","goals","rocks","cards","measurables"];
const ORG=["people","units"]; // the organisation: saved before the content that refers to it
function createRemoteBackend(kind,transport,config){
  const synced=new Map(),etags=new Map(); // "collection/id" → JSON as last stored / its ETag
  const key=(c,id)=>`${c}/${id}`;
  let flushing=null,again=false,retryTimer=null;

  async function fetchAll(){
    const {status,json}=await transport("GET","data");
    if(status!==200)throw new Error(json?.error||(status===0?"The server can't be reached.":`Loading failed (error ${status}).`));
    if(json.waiting)return {waiting:json.me,meId:json.meId}; // signed in, not in a team yet: the server sends nothing else
    if(json.meta?.version>DATA_VERSION)throw new Error("The data is newer than this version of the app (was an older version deployed again?). Reload the page; if that doesn't help, deploy the latest version.");
    const sync=new Map(),tags=new Map();
    const take=(c,rec)=>{tags.set(key(c,rec.id),rec._etag);delete rec._etag;sync.set(key(c,rec.id),JSON.stringify(rec))};
    if(json.meta)take("meta",json.meta);
    SYNCED.forEach(c=>(json[c]||[]).forEach(rec=>take(c,rec)));
    let data;
    if(!json.meta&&!json.units.length){ // empty database: start with the organisation (plus sample content where SEED=sample)
      data=config.seed==="sample"?seed():{version:DATA_VERSION,people:[],units:seedOrg(),goals:[],rocks:[],cards:[]};
      data.people=[...json.people,...data.people];
    }else data={version:json.meta?.version??DATA_VERSION,...Object.fromEntries(SYNCED.map(c=>[c,json[c]||[]]))};
    return {data:prepareData(migrate(data)),sync,tags,meId:json.meId,adminEmails:json.adminEmails||[]}; // migrated records differ from `sync`, so save() stores them
  }
  function adopt(snap){
    synced.clear();etags.clear();
    snap.sync.forEach((v,k)=>synced.set(k,v));snap.tags.forEach((v,k)=>etags.set(k,v));
    S=snap.data;session.userId=snap.meId;adminEmails=snap.adminEmails;refreshRights();
  }
  /* what to store: records that differ from the last stored copy and that you may write (rights.writeAllowed, the same rule
     the server applies: e.g. people and units only by admins). While other changes wait for someone who may write them,
     e.g. after a migration, the data version isn't moved either. */
  function changes(){
    const now=new Map([["meta/meta",{c:"meta",rec:{id:"meta",version:S.version}}]]);
    SYNCED.forEach(c=>S[c].forEach(rec=>now.set(key(c,rec.id),{c,rec})));
    const before=k=>synced.has(k)?JSON.parse(synced.get(k)):null,allowed=(c,k,rec)=>rights.writeAllowed(me(),c,before(k),rec); // the server's rule
    const puts=[],dels=[];let blocked=false;
    for(const [k,{c,rec}] of now){
      const json=JSON.stringify(rec);if(synced.get(k)===json)continue;
      if(allowed(c,k,rec))puts.push({k,c,rec,json});else blocked=true;
    }
    for(const k of synced.keys())if(!now.has(k)){if(allowed(k.split("/")[0],k,null))dels.push(k);else blocked=true}
    return {puts:blocked?puts.filter(p=>p.c!=="meta"):puts,dels};
  }
  async function putOne({k,c,rec,json}){
    const {status,json:res}=await transport("PUT",`items/${c}/${encodeURIComponent(rec.id)}`,{record:rec,ifMatch:etags.get(k)||null});
    if(status!==200||!res?.record)return {status,error:res?.error,title:rec.title||rec.name};
    const stored=res.record;
    etags.set(k,stored._etag);delete stored._etag;
    if(JSON.stringify(rec)===json){ // not edited again meanwhile: take over what the server changed (pasted images → attachment links)
      for(const f in stored)if(JSON.stringify(stored[f])!==JSON.stringify(rec[f]))rec[f]=stored[f];
      synced.set(k,JSON.stringify(rec));
    }else synced.set(k,JSON.stringify(stored)); // edited meanwhile: the next save sends the newer version
    return null;
  }
  async function deleteOne(k){
    const [c,id]=k.split("/");
    const {status,json:res}=await transport("DELETE",`items/${c}/${encodeURIComponent(id)}`);
    if(status!==204&&status!==404)return {status,error:res?.error};

/* rights:start — this block is identical in index.html and api/src/core.js (tests/api-core.test.html checks that).
   Who may see and change what. The tree: company → departments → teams; meetings (forums) and teams without a department
   hang under the company. Rights flow down, never up: belonging to a unit gives rights on it and on everything below it
   (a director in the company has rights everywhere; a team member has none on the department above). Admins: everything,
   even without any unit, and only admins grant the admin flag. Everyone assigned sees the whole organisation
   and all goals; rocks and Level 10 boards only where they have rights.
   - goals, rocks, cards: change them in units you have rights on. Goals live on any unit; rocks and Level 10 boards only
     on teams and meetings ("team level"), like the Scorecard (measurables). A meeting's members also fully edit the
     rocks the meeting shows (and the measurables tracked in it).
   - membership ("who is in a unit"): add and remove people in units you have rights on (a team member: their own team).
   - structure (create, rename, reorder, delete, move a unit): only units *below* your own: a department member manages
     its teams, a company member the departments, teams and meetings. A unit can't change itself or anything above it.
   - private meetings (unit.private, e.g. the DT Team): only their direct members see and change their rocks and board,
     and the goals set to be visible to them only (goal.visibleTo).
     Rights don't flow into them, not even for admins; their rocks never show up in other meetings; only members rename,
     delete or un-private them. Admins can still add themselves as a member (break-glass, visible to everyone). */
function createRights({units,people,adminEmails}){
  const byId=new Map(units.map(u=>[u.id,u]));
  const company=units.find(u=>u.kind==="company");
  // the unit above u (also for a record not stored yet): a team's department, else the company
  const parentOf=u=>u.kind==="company"?null:u.kind==="team"&&byId.get(u.parentId)?.kind==="department"?byId.get(u.parentId):company||null;
  const above=new Map(); // unit id → the ids of the units above it
  for(const u of units){const ids=[];for(let p=parentOf(u),n=0;p&&n<10;p=parentOf(p),n++)ids.push(p.id);above.set(u.id,ids)}
  const admins=(adminEmails||[]).map(e=>String(e).toLowerCase());
  const isAdmin=p=>!!p&&(p.admin===true||admins.includes(String(p.email||"").toLowerCase()));
  const memberOf=p=>(p&&p.unitIds)||[];
  const isMember=(p,unitId)=>memberOf(p).includes(unitId); // directly, not through a unit above
  const isPrivate=unitId=>byId.get(unitId)?.private===true;
  const role=p=>isAdmin(p)?"admin":memberOf(p).length?"member":"pending";
  const hasRights=(p,unitId)=>isPrivate(unitId)?isMember(p,unitId)
    :isAdmin(p)||memberOf(p).some(m=>m===unitId||(above.get(unitId)||[]).includes(m));
  const canSeeContent=(p,unitId)=>!isPrivate(unitId)||isMember(p,unitId); // a private meeting's rocks and cards: members only
  // the rocks a meeting shows: its own, and (if its rules say so) tracked or escalated ones, never a private meeting's
  const inForum=(f,r)=>r.unitId===f.id||(!isPrivate(r.unitId)&&((f.includeTracked&&(r.trackIn||[]).includes(f.id))||(f.includeEscalated&&r.status==="escalate")));
  // rocks: your units' rocks, plus every rock a meeting you're in shows (its members fully edit those)
  const canEditRock=(p,r)=>hasRights(p,r.unitId)||units.some(f=>f.kind==="forum"&&inForum(f,r)&&hasRights(p,f.id));
  const teamLevel=id=>{const u=byId.get(id);return !!u&&(u.kind==="team"||u.kind==="forum")}; // where rocks and boards live
  // goals visible to a private meeting only (goal.visibleTo, e.g. the DT Team's company goals): its members only, admins too
  const canSeeGoal=(p,g)=>!g.visibleTo||isMember(p,g.visibleTo);
  const canEdit={goals:(p,g)=>canSeeGoal(p,g)&&hasRights(p,g.unitId),rocks:canEditRock,cards:(p,c)=>hasRights(p,c.unitId),
    measurables:canEditRock}; // scorecard rows: like rocks (a meeting shows its own plus the ones tracked in it)
  const TEAM_LEVEL=["rocks","cards","measurables"]; // these live on teams and meetings only
  // structure: managed by whoever has rights on the unit above (so never by the unit itself); the company only by admins;
  // a private meeting only by its own members
  const canManageUnit=(p,u)=>u.private===true||isPrivate(u.id)?isMember(p,u.id)
    :isAdmin(p)||(u.kind!=="company"&&!!parentOf(u)&&hasRights(p,parentOf(u).id));
  const canManageMembers=(p,unitId)=>hasRights(p,unitId)||isAdmin(p); // admins may always add themselves (break-glass)
  // a record's fields apart from some keys (and _etag etc.), to check that nothing else changed
  const fieldsBut=(x,skip)=>JSON.stringify(Object.keys(x||{}).filter(k=>!skip.includes(k)&&k[0]!=="_").sort().map(k=>[k,x[k]]));
  return {
    isAdmin,role,hasRights,canEditRock,teamLevel,canManageUnit,canManageMembers,isMember,isPrivate,canSeeContent,inForum,canSeeGoal,
    canSeeRock:canEditRock, // rocks: you see exactly the ones you can change (your teams and below, plus what your meetings show)
    canSeeMeasurable:canEditRock, // scorecard rows: the same rule (trackIn: a few measurables shown in Business Review)
    canEditGoal:canEdit.goals,
    canEditCard:canEdit.cards,
    canSeeBoard:(p,unitId)=>teamLevel(unitId)&&hasRights(p,unitId), // Level 10: the team and meeting boards of your units and below
    // the team filter: the company, your units, the units above them and the units below them (private meetings: members only)

      return units.map(u=>u.id).filter(id=>ids.has(id)&&canSeeContent(p,id));
    },
    // may p replace `before` with `after` in a collection (before = null: create, after = null: delete)? Checked on every write.
    writeAllowed(p,collection,before,after){
      if(role(p)==="pending")return false;
      if(TEAM_LEVEL.includes(collection)&&after&&!teamLevel(after.unitId))return false; // for everyone, admins too
      if(TEAM_LEVEL.includes(collection)&&[before,after].some(x=>x&&!canSeeContent(p,x.unitId)))return false; // private: admins too
      if(collection==="units"&&before&&before.private===true&&!isMember(p,before.id))return false; // only members change a private meeting, admins too
      if(collection==="goals"&&[before,after].some(g=>g&&!canSeeGoal(p,g)))return false; // a hidden goal: its meeting's members only, admins too
      if(collection==="goals"&&after&&after.visibleTo&&!isPrivate(after.visibleTo))return false; // hidden only behind a private meeting
      if(isAdmin(p)||collection==="meta")return true;
      if(collection==="units"){ // structure: rights on the unit above, before and after (moving a team needs both departments)
        if(!before&&!after)return false;
        if(after&&(after.kind==="company"||(before&&before.kind!==after.kind)))return false;
        if(!before&&after.private===true)return !!parentOf(after)&&hasRights(p,parentOf(after).id); // creating a private meeting
        return (!before||canManageUnit(p,before))&&(!after||canManageUnit(p,after));

      if(collection==="people"){ // membership only: nothing else of a person changes, and every unit added or removed is yours
        if(!before||!after||fieldsBut(before,["unitIds"])!==fieldsBut(after,["unitIds"]))return false; // people are created at sign-in
        const was=memberOf(before),now=memberOf(after);

      }

      if(before&&!can(p,before))return false;
      // creating, or moving to another unit, needs rights on that unit itself: a meeting member may edit and resolve
      // the rocks it shows, but not move them to another team or create rocks for other teams
      if(after&&(!before||after.unitId!==before.unitId)&&!hasRights(p,after.unitId))return false;
      return true;
    },

}
