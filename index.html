<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- published on GitHub Pages; keep it out of search engines -->
<title>EOS Tracker</title>
<!-- favicon = the top-bar logo (colours inlined: --green / --ink-3, CSS variables don't work in favicons) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27 fill=%27none%27%3E%3Cpath d=%27M4 18 L9 7 L14 13 L18 9 L23 18 Z%27 fill=%27%2319A974%27/%3E%3Cpath d=%27M2 20h22%27 stroke=%27%238A95A6%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#F3F5F9; --surface:#FFFFFF; --line:#E3E7EE; --line-strong:#C9D0DB;
  --ink:#1C2430; --ink-2:#5B6778; --ink-3:#8A95A6;
  --accent:#2F6FE4; --accent-soft:#E6EEFC;
  --green:#19A974; --green-deep:#0E7A5A; --green-soft:#DDF5EA;
  --red:#D93B4F; --red-deep:#A51E35; --red-soft:#FBE4E7;
  --amber:#E29A1C; --amber-soft:#FCF0D8;
  --grey-pill:#C7CDD7; --grey-fill:#8A95A6;
  --company:#5B4BDB; --department:#1F8FD1; --team:#19A974; --forum:#E2741C;
  --shadow:0 10px 30px rgba(28,36,48,.14);
  --radius:10px;
  --font-body:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  --font-title:"Titillium Web",Figtree,"Segoe UI",system-ui,sans-serif; /* titles only: app name, view h1, modal title (DESIGN.md §1) */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
    --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
    --accent:#6B9BFF; --accent-soft:#213353;
    --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
    --grey-pill:#3A4556; --grey-fill:#7D8898;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --canvas:#141922; --surface:#1C232E; --line:#2A3340; --line-strong:#3A4556;
  --ink:#EDF1F7; --ink-2:#AEB8C8; --ink-3:#7D8898;
  --accent:#6B9BFF; --accent-soft:#213353;
  --green-soft:#17382C; --red-soft:#3F1F26; --amber-soft:#3E3119;
  --grey-pill:#3A4556; --grey-fill:#7D8898;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--ink);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;gap:20px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:700;font-size:18px}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(28,36,48,.12)}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-solid:hover{filter:brightness(1.07);background:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--canvas);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
select.ctl{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600}
select.ctl.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.checks{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);user-select:none}
.checks label:last-child{border-right:0}
.checks label:has(input:checked){color:var(--ink)}
.checks input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.checks .dot{width:7px;height:7px}
tr.ctx td{opacity:.45}
tr.ctx td .pill,tr.ctx td .dot{filter:grayscale(1)}

main{max-width:1280px;margin:0 auto;padding:22px 24px 72px} /* bottom room for the fixed theme toggle */
.topfilter{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2)}
.topfilter .combo input{width:220px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:600;cursor:pointer}
.topfilter .combo input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft);cursor:text}
.topfilter .combo.active input{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.topfilter .combo .list{font-weight:400;color:var(--ink)}
#tip{position:fixed;z-index:40;max-width:360px;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;display:none;white-space:pre-line}
#tip.show{display:block}
main.wide{max-width:none}
.viewhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.viewhead h1{font-family:var(--font-title);font-size:22px;margin:0;font-weight:700}
.viewhead .count{color:var(--ink-3);font-weight:500}

/* tables */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
th.sortable .arr{display:inline-block;width:12px;margin-left:4px;color:var(--ink-3);font-size:11px}
th.sortable[aria-sort="ascending"] .arr::after{content:"▲";color:var(--accent)}
th.sortable[aria-sort="descending"] .arr::after{content:"▼";color:var(--accent)}
thead th{text-align:left;font-weight:700;color:var(--ink);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
tbody td{padding:0 12px;height:46px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row:hover td{background:color-mix(in srgb,var(--canvas) 60%,var(--surface))}
td.title{font-weight:400}
.titlebtn{border:0;background:none;padding:0;text-align:left;font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:8px;max-width:100%}
.titlebtn:hover{color:var(--accent)}
.titlebtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.cell-link{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chev{width:24px;height:24px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;padding:0}
.chev svg{width:12px;height:12px;transition:transform .18s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev.leaf{visibility:hidden}
.chev.lone{visibility:visible;border-style:dashed;border-color:var(--line);background:transparent;cursor:default;pointer-events:none}
.chev.lone svg{display:none}
.addrow td{height:40px;color:var(--ink-3)}
.addrow button{border:0;background:none;color:var(--ink-3);font-weight:500;padding:0}
.addrow button:hover{color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lvl-Company{background:color-mix(in srgb,var(--company) 14%,transparent);color:var(--company)}
.lvl-Department{background:color-mix(in srgb,var(--department) 14%,transparent);color:var(--department)}
.lvl-Team{background:color-mix(in srgb,var(--team) 16%,transparent);color:var(--team)}
.brtag{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--forum);background:color-mix(in srgb,var(--forum) 14%,transparent);border-radius:5px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.chkrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;justify-self:start}
.chkrow input{accent-color:var(--forum);width:14px;height:14px;margin:0}
.goalpill{background:var(--accent-soft);color:var(--accent)}
.teampill{background:var(--canvas);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* status: coloured trigger button + custom menu (native <select> popups can't be styled on Windows) */
.st-not{background:var(--grey-pill)!important;color:var(--ink-2)!important}
.st-on{background:var(--green)!important}
.st-off{background:var(--red)!important}
.st-esc{background:var(--red-deep)!important}
.st-done{background:var(--green-deep)!important}
.st-can{background:repeating-linear-gradient(135deg,var(--grey-pill) 0 6px,color-mix(in srgb,var(--grey-pill) 70%,var(--surface)) 6px 12px)!important;color:var(--ink-2)!important}
.stbtn{position:relative;border:0;border-radius:7px;padding:5px 28px 5px 11px;font-weight:600;font-size:13px;min-width:132px;color:#fff;text-align:left;white-space:nowrap}
.stbtn.st-can{text-decoration:line-through}
.stbtn::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.8}
.stbtn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.stbtn:hover{filter:brightness(1.05)}
.stmenu{position:fixed;z-index:15;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:4px}
.stmenu[hidden]{display:none}
.stmenu .it{display:grid;grid-template-columns:12px 1fr 16px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;text-align:left;font-size:13.5px;font-weight:500;color:var(--ink)}
.stmenu .it:hover,.stmenu .it:focus-visible{background:var(--canvas);outline:none}
.stmenu .it[aria-checked="true"]{font-weight:700}
.stmenu .it .sq{width:12px;height:12px;border-radius:4px}
.stmenu .it .ck{color:var(--accent);display:inline-flex}
.stmenu .it .ck svg{width:14px;height:14px}
.stmenu .sep{height:1px;background:var(--line);margin:4px 6px}
/* milestone toggle */
.ms-toggle{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 10px;font-weight:600;font-size:12.5px;color:var(--ink-2);min-width:68px}
.ms-toggle.done{background:var(--green);border-color:var(--green);color:#fff}

/* progress bar */
.prog{display:inline-flex;align-items:center;gap:8px}
.prog .bar{display:flex;height:16px;width:110px;border-radius:4px;overflow:hidden;background:var(--grey-pill)}
.prog .done{background:var(--green)}
.prog .over{background:var(--red)}
.prog .lbl{display:none}
.prog.none .bar{background:transparent;border:1px dashed var(--line-strong)}

/* owner */
.owner{display:inline-flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}

/* last update */
.lastupd{display:flex;align-items:center;gap:8px;min-width:0}
.lastupd .txt{flex:1 1 auto;min-width:0}
table.rocks{table-layout:auto}
table.rocks td.title,table.rocks th.fit,table.rocks td.fit{white-space:nowrap;width:1%}
table.rocks td.updcell{width:auto;min-width:220px;max-width:0}
table.rocks .treeline .titlebtn{flex:0 0 auto;min-width:0}
table.rocks .titlebtn .t{display:inline-block;max-width:420px;vertical-align:bottom}
.teamtag{font-size:11.5px;color:var(--ink-3);background:var(--canvas);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;font-weight:500;white-space:nowrap}
.lastupd .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:13px}
.lastupd .when{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.updbtn{border:0;background:none;color:var(--ink-3);padding:2px;border-radius:5px;display:inline-flex;flex:none}
.updbtn:hover{color:var(--accent);background:var(--accent-soft)}
.updbtn svg{width:16px;height:16px}
.updbtn.on{color:var(--accent);background:var(--accent-soft)}
td.updcell{position:relative}
.pop{position:fixed;z-index:8;width:320px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px}
.pop textarea{border:1px solid var(--line-strong);border-radius:8px;padding:8px;min-height:64px;resize:vertical;background:var(--surface);width:100%}
.pop textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pop .row{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.pop .hint{font-size:11.5px;color:var(--ink-3);margin-right:auto}

/* milestones subtable */
tr.sub>td{padding:0;background:var(--canvas)}
.subwrap{padding:10px 12px 12px 48px;border-left:4px solid var(--green);margin-left:14px}
.subwrap table{min-width:0;table-layout:fixed;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.subwrap thead th{font-size:12px;padding:8px 10px;font-weight:700;background:var(--surface)}
.subwrap tbody td{height:40px;padding:0 10px;background:var(--surface)}
.subwrap tr.overdue td{background:var(--red-soft)}
.subwrap .del{border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px;display:inline-flex;opacity:.55}
.subwrap tr:hover .del{opacity:1}
.subwrap .del:hover{color:var(--red);background:var(--red-soft)}
.subwrap .del svg{width:15px;height:15px}
.subwrap tr.overdue td{background:var(--red-soft)}
.subwrap tr.overdue .dl{color:var(--red);font-weight:600}
.dl{font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.soon{color:var(--amber)}
input.inline{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:100%}
input.inline:hover{border-color:var(--line-strong)}
input.inline:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.inline.date{width:auto}

/* tree */
.treeline{display:flex;align-items:center;gap:8px;min-width:0}
.treeline .titlebtn{min-width:0;flex:1 1 auto}
.treeline .titlebtn .t{display:block}
table.tree{table-layout:fixed}
table.tree tbody td{height:36px;padding-top:0;padding-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tree .cell-link{max-width:100%}
table.tree .cell-link span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.group td{height:30px;background:var(--canvas);color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding-left:12px;white-space:nowrap}
tr.group td .n{font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--ink-3)}
table.tree td.title{padding-left:calc(12px + var(--depth,0) * 20px)}
table.tree .chev{width:20px;height:20px}
table.tree .pill{padding:2px 9px;font-size:12px}

/* searchable nested combobox */
.combo{position:relative}
.combo input{width:100%;padding-right:30px!important;text-overflow:ellipsis}
.combo::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.combo.open::after{transform:translateY(-30%) rotate(225deg)}
.combo.has-dot input{padding-left:28px!important}
.combo .cur-dot{position:absolute;left:12px;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%);pointer-events:none}
#f-unit .list{left:0;right:auto}
.combo .list{position:absolute;left:auto;right:0;width:max(100%,380px);top:calc(100% + 4px);max-height:320px;overflow-y:auto;overflow-x:hidden;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);z-index:9;display:none;padding:4px}
.combo.open .list{display:block}
.combo .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.combo .item:hover,.combo .item.active{background:var(--accent-soft)}
.combo .item.sel{font-weight:600}
.combo .item.dis{color:var(--ink-3);cursor:default}
.combo .item.dis:hover{background:transparent}
.combo .item .t{flex:1 1 auto;min-width:0}
.combo .item .lvl{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;padding-left:8px}
.combo .none{padding:8px 10px;color:var(--ink-3);font-size:13px}
.combo .grp{padding:9px 10px 3px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.grid12{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:640px){.grid12{grid-template-columns:1fr}}
.mtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line)}
.mtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.hist{display:grid;gap:0}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.hist .h:last-child{border-bottom:0}
.hist .h .what{font-size:13.5px}
.hist .h .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(14,18,26,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:720px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--font-title);font-size:20px;font-weight:700;flex:1}
.modal .body{padding:18px 20px;display:grid;gap:14px}
.modal footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end}
.field{display:grid;gap:5px;align-content:start} /* keep label + control at the top when a neighbouring field is taller */
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.modal.wide{max-width:1040px}
.twocol{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
.twocol>.main{border-right:1px solid var(--line);min-width:0}
.twocol>.main>.body{min-height:440px;align-content:start}
/* milestone list in the rock modal */

// bring older saved data up to date (runs before the helpers below exist, so keep it self-contained)
function migrate(){
  [...S.goals,...S.rocks].forEach(x=>{if(x.team==="Company")x.team=COMPANY}); // the company unit was renamed to its real name
  if(!S.cards)S.cards=seedCards(); // Level 10 boards were added later
  if(!S.forums){S.forums=seedForums();S.rocks.forEach(r=>{if(r.id==="r3"||r.id==="r19")r.trackBR=true})} // Business Review was added later (sample rocks tracked)

const isPast=s=>s&&new Date(s+"T00:00:00")<TODAY;
const isSoon=s=>{if(!s)return false;const dt=new Date(s+"T00:00:00");const diff=(dt-TODAY)/864e5;return diff>=0&&diff<=7};
const localISO=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
const todayISO=()=>localISO(TODAY); // local date; toISOString() would give yesterday in timezones east of UTC
const parseD=s=>new Date(s+"T00:00:00");
const mondayOf=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const isoWeek=dt=>{const x=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));return Math.ceil(((x-Date.UTC(x.getUTCFullYear(),0,1))/864e5+1)/7)};
const quarterRange=q=>{const [,n,y]=q.match(/Q(\d) (\d{4})/).map(Number);return [new Date(y,(n-1)*3,1),new Date(y,n*3,0)]};
/* organisation helpers. A "unit" is what goals and rocks store in .team: COMPANY, a department name, or a team name.
   A goal's level follows from its unit (levelOf). A team named like its own department (HR) counts as the department. */
const isDept=u=>S.departments.some(d=>d.name===u);
const deptOf=u=>u===COMPANY?null:(S.departments.find(d=>d.name===u)||S.departments.find(d=>d.teams.includes(u)))?.name||null;
const forum=u=>(S.forums||[]).find(f=>f.name===u);
const isForum=u=>!!forum(u);
const levelOf=u=>u===COMPANY?"Company":isDept(u)?"Department":isForum(u)?"Forum":"Team"; // "Forum" only colours dots; goals never have it
const unitMatches=(u,filter)=>!filter||u===filter||(isDept(filter)&&deptOf(u)===filter); // a department filter includes its teams
// rocks: a forum shows its own rocks plus the rocks its rule pulls in from other teams
function rockMatches(r,filter){
  const f=forum(filter);
  if(!f)return unitMatches(r.team,filter);
  return r.team===filter||(f.includeTracked&&r.trackBR)||(f.includeEscalated&&r.status==="OT - Escalate");
}
const goalFilter=()=>isForum(teamFilter)?"":teamFilter; // forums have no goals: the plan shows everything

const statusClass=st=>(STATUSES.find(x=>x[0]===st)||STATUSES[0])[1];
function toast(msg,ms=1600){
  const t=$("#toast");if(Date.now()<(t._lock||0))return; // a long (warning) toast isn't overwritten by a routine "saved" toast
  t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);if(ms>2000)t._lock=Date.now()+ms;
}

/* ---------- plan view ---------- */
function renderPlan(){
  const all=S.goals;
  const match=g=>fTypes.has(g.level)&&unitMatches(g.team,goalFilter());
  const filtering=fTypes.size<LEVELS.length||!!goalFilter();
  let goals=all.filter(match);
  const ctx=new Set(); // ancestors shown for context in tree view
  if(planMode==="tree"&&filtering){
    const keep=new Set(goals.map(g=>g.id));
    goals.forEach(g=>{let p=g.parentId;while(p&&!keep.has(p)){ctx.add(p);keep.add(p);p=(goal(p)||{}).parentId}});
    goals=all.filter(g=>keep.has(g.id));
  }
  const matched=goals.length-ctx.size;
  const head=`<div class="viewhead"><h1>One Year Plan ${YEAR}${goalFilter()?` <span class="dim">· ${esc(teamFilter)}</span>`:""}</h1>${isForum(teamFilter)?`<span class="muted" style="font-size:12.5px">${esc(teamFilter)} has no goals, so all goals are shown ·</span>`:""}<span class="count">${filtering?`${matched} of ${all.length}`:all.length} goals</span><div class="spacer"></div>
    <div class="checks" role="group" aria-label="Filter by type">${LEVELS.map(l=>`<label><input type="checkbox" data-filter="type" value="${l}" ${fTypes.has(l)?"checked":""}><span class="dot" style="background:var(--${l.toLowerCase()})"></span>${l}</label>`).join("")}</div>
    ${planMode==="tree"?`<button class="btn sm" data-act="toggleall">${collapsed.size?"Expand all":"Collapse all"}</button>`:""}
    <div class="seg" role="group" aria-label="View"><button data-mode="list" aria-pressed="${planMode==="list"}">List</button><button data-mode="tree" aria-pressed="${planMode==="tree"}">Tree</button></div>
    <button class="btn primary" data-act="newgoal">+ New goal</button></div>`;
  goalRow.ctx=ctx;
  const th=(key,label,w)=>`<th class="sortable" style="width:${w}" data-sort="${key}" aria-sort="${sortCol===key?(sortDir>0?"ascending":"descending"):"none"}">${label}<span class="arr"></span></th>`;
  const cols=`<thead><tr>${th("title","Title","44%")}${th("type","Type","14%")}${th("team","Team","16%")}${th("linked","Linked to goal","26%")}</tr></thead>`;
  const cmp=(key,dir)=>(a,b)=>dir*(key==="type"?(LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level)||a.title.localeCompare(b.title)):key==="team"?(a.team.localeCompare(b.team)||a.title.localeCompare(b.title)):a.title.localeCompare(b.title));
  const az=(a,b)=>a.title.localeCompare(b.title);
  let rows="";
  if(planMode==="list"){
    if(sortCol==="linked"){
      // hierarchy-aware: roots in chosen direction, each followed by its children A→Z, then theirs
      const kids=p=>goals.filter(g=>(g.parentId||null)===p).sort(az);
      const flat=(g)=>[g,...kids(g.id).flatMap(flat)];
      const inSet=new Set(goals.map(g=>g.id));
      const roots=goals.filter(g=>!g.parentId||!inSet.has(g.parentId)).sort((a,b)=>sortDir*az(a,b));
      const companyRoots=roots.filter(g=>g.level==="Company");
      const orphanParents=roots.filter(g=>g.level!=="Company"&&kids(g.id).length);
      const loners=roots.filter(g=>g.level!=="Company"&&!kids(g.id).length);
      rows=companyRoots.flatMap(flat).map(g=>goalRow(g,0,false)).join("");
      const orphanCount=orphanParents.length+loners.length;
      if(orphanCount) rows+=`<tr class="group"><td colspan="4">Not linked to a Company goal<span class="n">${orphanCount}</span></td></tr>`+[...orphanParents.flatMap(flat),...loners].map(g=>goalRow(g,0,false)).join("");
    }else rows=[...goals].sort(cmp(sortCol,sortDir)).map(g=>goalRow(g,0,false)).join("");
  }else{
    const sib=sortCol==="linked"?(a,b)=>az(a,b):cmp(sortCol,sortDir);
    const kids=p=>goals.filter(g=>(g.parentId||null)===p).sort(sib);
    const node=(g,depth)=>{const ch=kids(g.id);return goalRow(g,depth,ch.length>0)+(collapsed.has(g.id)?"":ch.map(c=>node(c,depth+1)).join(""))};
    const rootSort=sortCol==="linked"?(a,b)=>sortDir*az(a,b):cmp(sortCol,sortDir);
    const roots=goals.filter(g=>!g.parentId).sort(rootSort), companyRoots=roots.filter(g=>g.level==="Company");
    const orphanParents=roots.filter(g=>g.level!=="Company"&&kids(g.id).length), loners=roots.filter(g=>g.level!=="Company"&&!kids(g.id).length);
    rows=companyRoots.map(g=>node(g,0)).join("");
    const orphanCount=orphanParents.length+loners.length;
    if(orphanCount) rows+=`<tr class="group"><td colspan="4">Not linked to a Company goal<span class="n">${orphanCount}</span></td></tr>`+orphanParents.map(g=>node(g,0)).join("")+loners.map(g=>node(g,0)).join("");
  }
  if(!goals.length) rows=`<tr><td colspan="4"><div class="empty"><b>No goals match these filters</b>Try a different type or team, or clear the filters.</div></td></tr>`;
  rows+=`<tr class="addrow"><td colspan="4"><button data-act="newgoal">+ Add goal</button></td></tr>`;
  return head+`<div class="board"><div class="scroll"><table class="${planMode==="tree"?"tree":""}">${cols}<tbody>${rows}</tbody></table></div></div>`;
}

function renderReview(){
  if(!quarterFilter) quarterFilter=S.quarter||QUARTERS[0];
  const rocks=S.rocks.filter(r=>r.quarter===quarterFilter&&rockMatches(r,teamFilter));
  // weeks span the quarter, widened to include every milestone deadline of the shown rocks
  let [start,end]=quarterRange(quarterFilter);
  rocks.forEach(r=>(r.milestones||[]).forEach(m=>{if(!m.deadline)return;const dt=parseD(m.deadline);if(dt<start)start=dt;if(dt>end)end=dt}));
  const weeks=[];for(const w=mondayOf(start);w<=end;w.setDate(w.getDate()+7))weeks.push(localISO(w));
  const nowWk=localISO(mondayOf(TODAY));
  const wkCls=k=>k<nowWk?"past":k===nowWk?"now":"";
  const head=`<div class="viewhead"><h1>Rock Review${teamFilter?` <span class="dim">· ${esc(teamFilter)}</span>`:""}</h1><span class="count">${rocks.length} rock${rocks.length===1?"":"s"} · week ${isoWeek(TODAY)}</span><div class="spacer"></div>

  const chip=(r,m)=>{
    const over=!m.done&&isPast(m.deadline),soon=!m.done&&!over&&isSoon(m.deadline);
    const day=parseD(m.deadline).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    const u=(m.updates||[])[0];
    const tipText=`${m.title}\nDeadline ${day}${m.done?" · done":over?" · overdue":""}${u?`\nLatest: ${u.text}`:""}\nClick to mark ${m.done?"to do":"done"}`;
    return `<button class="chip ${m.done?"done":over?"over":soon?"soon":""}" data-act="mtoggle" data-rock="${r.id}" data-id="${m.id}" data-tip="${esc(tipText)}">${esc(m.title)}</button>`;
  };
  const updBtn=r=>{
    const u=(r.updates||[])[0];

    return `<button class="updbtn ${u?"has":""} ${updIsOpen(r,"rock")?"on":""}" data-act="addupd" data-kind="rock" data-id="${r.id}" aria-label="Add update" data-tip="${esc(tipText)}">${ICONS.note}</button>`;
  };
  // two tables side by side: the rock column stays put, only the weeks scroll; row heights are synced in syncReviewRows()
  const rowCls=r=>`row ${r.status==="Cancelled"?"cancelled":""}`;
  let left=rocks.map(r=>{
    const undated=(r.milestones||[]).filter(m=>!m.deadline).length;
    return `<tr class="${rowCls(r)}"><td class="rk"><div class="rkcell">
      <div class="rkhead">${ownerHTML(r.ownerId)}<button class="titlebtn" data-act="editrock" data-id="${r.id}"><span class="t">${esc(r.title)}</span></button>${r.team&&r.team!==teamFilter?`<span class="teamtag">${esc(r.team)}</span>`:""}${brTag(r)}${updBtn(r)}</div>
      <div class="rkmeta">${statusSelect(r)}${progressHTML(r)}${undated?`<span class="muted" style="font-size:12px">${undated} undated</span>`:""}${idsBtn(r)}</div>
    </div></td></tr>`;
  }).join("");
  let right=rocks.map(r=>{
    const byWk={};
    (r.milestones||[]).forEach(m=>{if(m.deadline)(byWk[localISO(mondayOf(parseD(m.deadline)))]??=[]).push(m)});
    return `<tr class="${rowCls(r)}">${weeks.map(k=>`<td class="wkc ${k===nowWk?"now":""}">${(byWk[k]||[]).sort((a,b)=>a.deadline.localeCompare(b.deadline)).map(m=>chip(r,m)).join("")}</td>`).join("")}</tr>`;
  }).join("");
  if(!rocks.length){left=`<tr><td class="rk"><div class="empty"><b>No rocks for ${esc(quarterFilter)}${teamFilter?` in ${esc(teamFilter)}`:""}</b>Add rocks in the Rocks tab.</div></td></tr>`;right=`<tr><td colspan="${weeks.length}"></td></tr>`}
  // the update popover lives outside the tables so it is never covered by the next row
  const openRock=updOpen&&updOpen.kind==="rock"?rocks.find(r=>r.id===updOpen.id):null;
  const legend=`<div class="legend" style="margin-top:10px"><span><i class="sw" style="background:var(--green)"></i> done</span><span><i class="sw" style="background:var(--red)"></i> overdue</span><span><i class="sw" style="background:var(--amber)"></i> due within 7 days</span><span><i class="sw" style="background:var(--grey-fill)"></i> to do</span><span>· Click a milestone to mark it done</span></div>`;
  return head+`<div class="board rrwrap"><table class="rr rr-left"><thead><tr><th class="rk">Rock</th></tr></thead><tbody>${left}</tbody></table>`
    +`<div class="scroll rr-scroll"><table class="rr rr-right">${cols}<tbody>${right}</tbody></table></div></div>`+legend+(openRock?updPopHTML(openRock,"rock"):"");
}
function syncReviewRows(){
  const L=[...document.querySelectorAll(".rr-left tr")],R=[...document.querySelectorAll(".rr-right tr")];

  L.forEach((tr,i)=>{tr.style.height=h[i]+"px";if(R[i])R[i].style.height=h[i]+"px"});
}

// move a card to a column, before another card (or to the end of that column)
function moveCard(id,col,beforeId){
  const c=card(id);if(!c||beforeId===id)return;
  const from=c.column;S.cards.splice(S.cards.indexOf(c),1);c.column=col;

function initPicker(id,{get,set,groups,emptyText,display,dotOf,noun="items",allowNone=true,noneText="",placeholder=""}){ // noneText: shown (and listed) for the empty value instead of "— none —"
  const box=$("#"+id),inp=$(`#${id}-in`),list=$(`#${id}-list`);
  let active=-1,typed=false; // until the user types, the input shows the current value and must not act as a filter
  const setLabel=()=>{const v=get();inp.value=v?display(v):noneText;inp.placeholder=v||noneText?"":placeholder||(allowNone?"None — type to search":"Type to search");
    if(dotOf){const d=$(".cur-dot",box);d.style.background=v?`var(--${dotOf(v).toLowerCase()})`:"transparent"}};
  const draw=()=>{
    const q=typed?inp.value.trim().toLowerCase():"";
    const match=it=>!q||`${it.search||it.title} ${it.label||""}`.toLowerCase().includes(q);
    let html=q||!allowNone?"":`<div class="item ${!get()?"sel":""}" data-id="" role="option">${esc(noneText||"— none —")}</div>`,hits=0;
    groups().forEach(({name,items})=>{const its=items.filter(match);if(!its.length)return;hits+=its.length;
      html+=`<div class="grp">${esc(name)}</div>`+its.map(it=>`<div class="item ${it.id===get()?"sel":""}" data-id="${esc(it.id)}" role="option"${it.indent&&!q?` style="padding-left:${10+it.indent*18}px"`:""}><span class="dot" style="background:${it.color||`var(--${it.level.toLowerCase()})`}"></span><span class="t">${esc(it.title)}</span><span class="lvl">${esc(it.label||"")}</span></div>`).join("")});
    if(!hits&&!q&&emptyText)html+=`<div class="none">${esc(emptyText())}</div>`;
    list.innerHTML=hits||!q?html:`<div class="none">No ${noun} match “${esc(inp.value)}”</div>`;active=-1;

  const open=()=>{box.classList.add("open");inp.setAttribute("aria-expanded","true");draw();$(".item.sel",list)?.scrollIntoView({block:"nearest"})};
  const close=()=>{box.classList.remove("open");inp.setAttribute("aria-expanded","false");typed=false;setLabel()};
  const pick=v=>{set(v||null);close()};
  inp.addEventListener("focus",()=>{typed=false;inp.select();open()});
  inp.addEventListener("mousedown",()=>{if(document.activeElement===inp&&!isOpen())open()});
  inp.addEventListener("input",()=>{typed=true;open()});

    const its=[...list.querySelectorAll(".item")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!isOpen())open();active=Math.max(0,Math.min(its.length-1,active+(e.key==="ArrowDown"?1:-1)));its.forEach((it,i)=>it.classList.toggle("active",i===active));its[active]?.scrollIntoView({block:"nearest"})}

  });
  list.addEventListener("mousedown",e=>{const it=e.target.closest(".item");if(!it)return;e.preventDefault();pick(it.dataset.id)});
  inp.addEventListener("blur",()=>setTimeout(()=>{if(box.offsetParent)close()},120)); // skip if the modal was closed (hidden) meanwhile

}

function initLinkedPicker(g){

/* rock "Contributes to goal": every goal, ordered by closeness to the rock's team:
   own team → own department → Company → the rest, grouped by department */
function rockGoalGroups(unit){
  const dept=deptOf(unit),used=new Set();
  const take=gs=>gs.filter(g=>!used.has(g.id)).sort(byLevelTitle).filter(g=>used.add(g.id));
  const where=g=>g.level==="Department"?"Department":g.team; // shown on the right in the "other" groups
  const groups=[];
  if(unit===COMPANY)groups.push({name:COMPANY,goals:take(S.goals.filter(g=>g.level==="Company"))});
  else{
    groups.push({name:`${unit} · ${isDept(unit)?"your department":"your team"}`,goals:take(S.goals.filter(g=>g.team===unit))});
    if(dept&&dept!==unit)groups.push({name:`${dept} · your department`,goals:take(S.goals.filter(g=>g.team===dept))});
    groups.push({name:COMPANY,goals:take(S.goals.filter(g=>g.level==="Company"))});
  }
  const order=[...S.departments].sort((a,b)=>(b.name===dept)-(a.name===dept)); // own department's other teams first
  order.forEach(d=>groups.push({name:d.name===dept?`${d.name} · other teams`:d.name,goals:take(S.goals.filter(g=>deptOf(g.team)===d.name)),label:where}));
  groups.push({name:"Other",goals:take(S.goals),label:where}); // goals on a team that isn't in the org structure
  return groups;
}

/* description editor: plain-text paste, pasted/dropped images are downscaled and embedded as data URLs */
function initRichText(el){
  const insertImage=(file,range)=>{
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement("canvas");
      cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      let url=cv.toDataURL("image/png");if(url.length>500000)url=cv.toDataURL("image/jpeg",.85); // PNG keeps text crisp; big photos go JPEG
      const node=document.createElement("img");node.src=url;
      if(range&&el.contains(range.startContainer)){range.deleteContents();range.insertNode(node);range.setStartAfter(node);range.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(range)}
      else el.appendChild(node);
    };img.src=rd.result};
    rd.readAsDataURL(file);
  };
  const curRange=()=>{const s=getSelection();return s.rangeCount&&el.contains(s.anchorNode)?s.getRangeAt(0).cloneRange():null};
  el.addEventListener("paste",e=>{
    const files=[...(e.clipboardData?.items||[])].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile());
    e.preventDefault();
    if(files.length){files.forEach(f=>insertImage(f,curRange()))}
    else document.execCommand("insertText",false,e.clipboardData.getData("text/plain")); // never paste foreign HTML
  });
  el.addEventListener("dragover",e=>{if([...e.dataTransfer.items].some(i=>i.kind==="file"))e.preventDefault()});
  el.addEventListener("drop",e=>{const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));if(!files.length)return;e.preventDefault();
    const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;files.forEach(f=>insertImage(f,r))});
  el.addEventListener("click",e=>{if(e.target.tagName==="IMG")openLightbox(e.target.src)});
}
// keep only simple formatting and embedded raster images; everything else is unwrapped or dropped
function sanitizeHTML(html){
  const t=document.createElement("template");t.innerHTML=String(html||"");
  const OK=new Set(["DIV","P","BR","IMG","B","STRONG","I","EM","U","UL","OL","LI","SPAN"]),DROP=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","svg","SVG","MATH"]);
  const clean=n=>[...n.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||DROP.has(c.tagName)){c.remove();return}
    clean(c);
    if(!OK.has(c.tagName)){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{if(!(c.tagName==="IMG"&&a.name==="src"))c.removeAttribute(a.name)});
    if(c.tagName==="IMG"&&!/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(c.getAttribute("src")||""))c.remove();
  });
  clean(t.content);
  const out=t.innerHTML.trim();
  return /^(<br>|<div><br><\/div>)?$/.test(out)?"":out;
}
function openLightbox(src){
  const lb=$("#lightbox");$("img",lb).src=src;lb.classList.add("open");
  const close=()=>{lb.classList.remove("open");document.removeEventListener("keydown",key,true)};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();close()}};
  document.addEventListener("keydown",key,true);lb.onclick=close;
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{view=t.dataset.view;if(view==="review")rrScroll=null;render()}));
// Rock Review: remember horizontal scroll across re-renders; a real scroll closes the update popover (it is positioned to its button)
document.addEventListener("scroll",e=>{const el=e.target;if(!el.classList||!el.classList.contains("rr-scroll"))return;if(Math.abs(el.scrollLeft-(rrScroll??0))<1)return;rrScroll=el.scrollLeft;if(updOpen){updOpen=null;render()}},true);
/* light/dark toggle: follows the OS until clicked, then remembers the choice in this browser */
const THEME_KEY="eos-theme",darkMQ=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":darkMQ.matches};
const ICON_SUN='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>';
const ICON_MOON='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8z"/></svg>';
function drawThemeBtn(){const b=$("#themeBtn"),d=isDark();b.innerHTML=d?ICON_SUN:ICON_MOON;b.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode");b.dataset.tip=d?"Light mode":"Dark mode"}
$("#themeBtn").addEventListener("click",()=>{
  const next=isDark()?"light":"dark";document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  hideTip();drawThemeBtn();
});
darkMQ.addEventListener("change",drawThemeBtn); // OS switch while no choice is saved
drawThemeBtn();
// team filter in the top bar (all views): same picker as the Team field, plus "All teams"
$("#teamFilterWrap").innerHTML=`<label for="tf-in">Team</label>`+pickerHTML("tf",{dot:true});
tfPicker=initPicker("tf",{get:()=>teamFilter,set:v=>{teamFilter=v||"";rrScroll=null;render()},groups:()=>unitGroups(true),display:v=>v,dotOf:levelOf,noun:"teams",noneText:"All teams"});
// instant tooltips
const tip=$("#tip");let tipEl=null;
function showTip(el){const t=el.getAttribute("data-tip");if(!t)return;tip.textContent=t;tip.classList.add("show");const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=r.left,y=r.bottom+6;if(x+tw>window.innerWidth-8)x=window.innerWidth-tw-8;if(y+th>window.innerHeight-8)y=r.top-th-6;tip.style.left=x+"px";tip.style.top=y+"px";tipEl=el}
function hideTip(){tip.classList.remove("show");tipEl=null}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el!==tipEl){el?showTip(el):hideTip()}});
document.addEventListener("scroll",hideTip,true);
/* status menu (one shared element, positioned under the clicked status button) */
const stMenu={id:null,btn:null};
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function openStatusMenu(btn){
  closeStatusMenu();
  const r=S.rocks.find(x=>x.id===btn.dataset.id);if(!r)return;
  const menu=$("#stmenu");
  menu.innerHTML=STATUSES.map(([s,c],i)=>`${i===4?'<div class="sep" role="separator"></div>':""}<button class="it" role="menuitemradio" aria-checked="${s===r.status}" data-st="${esc(s)}"><span class="sq ${c}"></span><span>${esc(s)}</span><span class="ck">${s===r.status?CHECK:""}</span></button>`).join("");
  menu.hidden=false;
  const b=btn.getBoundingClientRect(),mh=menu.offsetHeight,mw=menu.offsetWidth;
  menu.style.left=Math.max(8,Math.min(b.left,innerWidth-mw-8))+"px";
  menu.style.top=(b.bottom+6+mh>innerHeight-8&&b.top-6-mh>8?b.top-6-mh:b.bottom+6)+"px"; // flip up when there's no room below
  stMenu.id=r.id;stMenu.btn=btn;btn.setAttribute("aria-expanded","true");
  ($('[aria-checked="true"]',menu)||$(".it",menu)).focus();
}
function closeStatusMenu(refocus){
  if(!stMenu.id)return;
  $("#stmenu").hidden=true;
  if(stMenu.btn&&stMenu.btn.isConnected){stMenu.btn.setAttribute("aria-expanded","false");if(refocus)stMenu.btn.focus()}
  stMenu.id=null;stMenu.btn=null;
}
function setStatus(id,status){
  const r=S.rocks.find(x=>x.id===id);if(!r||r.status===status)return;
  const old=r.status;r.status=status;logHist(r,`Status changed from ${old} to ${status}`);save();render();toast(`Status: ${status}`);
}
$("#stmenu").addEventListener("click",e=>{const it=e.target.closest("[data-st]");if(!it)return;const id=stMenu.id;closeStatusMenu();setStatus(id,it.dataset.st)});
$("#stmenu").addEventListener("keydown",e=>{
  const its=[...document.querySelectorAll("#stmenu .it")],i=its.indexOf(document.activeElement);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();its[(i+(e.key==="ArrowDown"?1:-1)+its.length)%its.length].focus()}
  else if(e.key==="Home"||e.key==="End"){e.preventDefault();its[e.key==="Home"?0:its.length-1].focus()}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeStatusMenu(true)}
  else if(e.key==="Tab")closeStatusMenu();
});
document.addEventListener("mousedown",e=>{if(stMenu.id&&!e.target.closest("#stmenu")&&e.target.closest("[data-act='statusmenu']")!==stMenu.btn)closeStatusMenu()});
document.addEventListener("scroll",e=>{if(stMenu.id&&!(e.target.closest&&e.target.closest("#stmenu")))closeStatusMenu()},true);
window.addEventListener("resize",()=>closeStatusMenu());
/* in-app confirmation dialog (window.confirm() is blocked in some embedded browsers) */
function askConfirm(msg,okLabel="Delete"){
  return new Promise(resolve=>{
    const bd=$("#cbackdrop");
    bd.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="c-msg" style="max-width:440px"><div class="body"><div id="c-msg" style="font-weight:600;font-size:14.5px">${esc(msg)}</div></div><footer><button class="btn" data-c="0">Cancel</button><button class="btn danger-solid" data-c="1">${esc(okLabel)}</button></footer></div>`;
    bd.classList.add("open");
    const done=v=>{bd.classList.remove("open");bd.onclick=null;document.removeEventListener("keydown",key,true);resolve(v)};
    const key=e=>{if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();e.stopImmediatePropagation();done(e.key==="Enter")}};
    document.addEventListener("keydown",key,true);
    bd.onclick=e=>{const c=e.target.closest("[data-c]");if(c)done(c.dataset.c==="1");else if(e.target===bd)done(false)};
    $('[data-c="0"]',bd).focus(); // default focus on Cancel so a stray Enter on the trigger doesn't delete
  });
}

$("#app").addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-mode],[data-sort]");if(!b)return;
  hideTip(); // the clicked element is about to be re-rendered
  if(b.dataset.mode){planMode=b.dataset.mode;render();return}
  if(b.dataset.sort){const k=b.dataset.sort;if(sortCol===k)sortDir=-sortDir;else{sortCol=k;sortDir=1}render();return}
  if(b.dataset.act==="toggleall"){if(collapsed.size)collapsed.clear();else S.goals.filter(g=>S.goals.some(c=>c.parentId===g.id)).forEach(g=>collapsed.add(g.id));render();return}
  const {act,id}=b.dataset;
  if(act==="collapse"){collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render()}
  else if(act==="expand"){expanded.has(id)?expanded.delete(id):expanded.add(id);render()}
  else if(act==="newgoal")goalModal(null);
  else if(act==="editgoal")goalModal(goal(id));
  else if(act==="newrock")rockModal(null);
  else if(act==="editrock")rockModal(S.rocks.find(r=>r.id===id));
  else if(act==="addupd"){const same=updOpen&&updOpen.kind===b.dataset.kind&&updOpen.id===id;updOpen=same?null:{kind:b.dataset.kind,id};render()}
  else if(act==="pickteam"){teamFilter=b.dataset.team;l10Add=null;render()}
  else if(act==="editcard")cardModal(card(id));
  else if(act==="rock2ids")rockToIDS(S.rocks.find(r=>r.id===id));
  else if(act==="kadd"){l10Add=b.dataset.col;render()}
  else if(act==="kaddcancel"){l10Add=null;render()}
  else if(act==="kaddsave")submitComposer();
  else if(act==="agenda"){const to=b.dataset.to;
    if(to==="review"){view="review";rrScroll=null;render();return}
    const col=$(`.kcol[data-col="${to}"]`);if(col){col.scrollIntoView({block:"nearest",behavior:"smooth"});col.classList.remove("flash");void col.offsetWidth;col.classList.add("flash")}}
  else if(act==="statusmenu"){stMenu.id===id?closeStatusMenu():openStatusMenu(b)}
  else if(act==="updcancel"){updOpen=null;render()}
  else if(act==="updpost")postQuickUpdate();
  else if(act==="mtoggle"){const r=S.rocks.find(r=>r.id===b.dataset.rock);const m=r.milestones.find(x=>x.id===id);m.done=!m.done;logHist(r,`Milestone “${m.title}” marked ${m.done?"done":"to do"}`);save();render()}
  else if(act==="msdel"){const r=S.rocks.find(x=>x.id===b.dataset.rock);const m=r.milestones.find(x=>x.id===id);askConfirm(`Delete milestone “${m.title}”?`,"Delete milestone").then(ok=>{if(!ok)return;r.milestones=r.milestones.filter(x=>x.id!==id);logHist(r,`Milestone “${m.title}” removed`);save();render();toast("Milestone deleted")})}
  else if(act==="newms"){const r=S.rocks.find(x=>x.id===id);r.milestones.push({id:uid(),title:"New milestone",done:false,deadline:"",updates:[]});expanded.add(id);save();render();
    const inp=document.querySelector(`[data-act="mtitle"][data-id="${r.milestones[r.milestones.length-1].id}"]`);inp&&(inp.focus(),inp.select())}
});
$("#app").addEventListener("change",e=>{
  const el=e.target;const {act,id}=el.dataset;
  if(el.dataset.filter==="type"){el.checked?fTypes.add(el.value):fTypes.delete(el.value);render();return}
  if(act==="quarter"){quarterFilter=el.value;rrScroll=null;S.quarter=el.value;save();render()}
  else if(act==="mtitle"||act==="mdate"){const m=S.rocks.find(r=>r.id===el.dataset.rock).milestones.find(x=>x.id===id);
    if(act==="mtitle")m.title=el.value.trim()||m.title;else m.deadline=el.value;save();render()}
});
/* Level 10: inline composer (Enter adds and keeps it open for the next card, Esc closes) */
function submitComposer(){
  const ta=$("#app .kcompose textarea");if(!ta||!l10Add)return;const t=ta.value.trim();if(!t){ta.focus();return}
  addCard(l10Add,t);render();
}
$("#app").addEventListener("keydown",e=>{
  if(e.target.matches(".kcompose textarea")){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submitComposer()}else if(e.key==="Escape"){l10Add=null;render()}return}
  if(e.target.matches(".kcard")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();cardModal(card(e.target.dataset.card))}
});
/* Level 10: drag cards between and within columns; a thin line shows where the card will land */
let dragId=null;
const dropMarker=document.createElement("div");dropMarker.className="kph";
$("#app").addEventListener("dragstart",e=>{const c=e.target.closest(".kcard");if(!c)return;dragId=c.dataset.card;hideTip();
  e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId);setTimeout(()=>c.classList.add("dragging"))});
$("#app").addEventListener("dragover",e=>{
  const col=e.target.closest(".kcol");if(!col||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  const list=$(".klist",col),after=[...list.querySelectorAll(".kcard:not(.dragging)")].find(k=>{const r=k.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  after?list.insertBefore(dropMarker,after):list.appendChild(dropMarker);
});
$("#app").addEventListener("drop",e=>{
  const col=e.target.closest(".kcol");if(!col||!dragId)return;e.preventDefault();
  const before=dropMarker.nextElementSibling?.dataset.card||null,id=dragId;dragId=null;dropMarker.remove();
  moveCard(id,col.dataset.col,before);
});
$("#app").addEventListener("dragend",()=>{dragId=null;dropMarker.remove();document.querySelectorAll(".kcard.dragging").forEach(k=>k.classList.remove("dragging"))});
$("#app").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input.inline"))e.target.blur();
  if(e.target.matches("[data-pop-text]")){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();postQuickUpdate()}else if(e.key==="Escape"){updOpen=null;render()}}
});
$("#app").addEventListener("input",e=>{if(e.target.matches("[data-pop-text]")&&updOpen)updOpen.draft=e.target.value});
window.addEventListener("scroll",()=>{if(updOpen){updOpen=null;render()}},{passive:true});
document.addEventListener("mousedown",e=>{if(updOpen&&!e.target.closest("[data-pop]")&&!e.target.closest('[data-act="addupd"]')){updOpen=null;render()}});
function postQuickUpdate(){
  const ta=$("[data-pop-text]");if(!ta||!updOpen)return;const t=ta.value.trim();if(!t){ta.focus();return}
  const [k,rockId]=updOpen.kind.split(":");
  const rock=S.rocks.find(r=>r.id===(k==="rock"?updOpen.id:rockId));
  const target=k==="rock"?rock:rock.milestones.find(m=>m.id===updOpen.id);
  (target.updates=target.updates||[]).unshift({at:todayISO(),text:t});
  logHist(rock,k==="rock"?"Posted an update":`Posted an update on milestone “${target.title}”`);
  updOpen=null;save();render();toast("Update posted");
}

$("#backdrop").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#backdrop").classList.contains("open"))closeModal()});
$("#modal").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]");if(!b)return;const m=b.dataset.m,id=b.dataset.id;
  if(m==="close")return closeModal();
  if(m==="tab"){if(modalState.kind==="rock")syncRockFields();if(modalState.kind==="card")syncCardFields();modalState.tab=b.dataset.tab;
    ({goal:drawGoalModal,rock:drawRockModal,card:drawCardModal})[modalState.kind]();return}
  if(modalState.kind==="card"){
    const c=modalState.obj;
    if(m==="updadd"){const t=$("#f-newupd").value.trim();if(!t)return;syncCardFields();c.updates.unshift({at:todayISO(),text:t});drawCardModal()}
    else if(m==="cardcol"){c.column=b.dataset.col;document.querySelectorAll('#modal [data-m="cardcol"]').forEach(x=>x.setAttribute("aria-pressed",x===b));$("#modal header h2").textContent=`${colName(c.column)} item`}
    else if(m==="ownerdel"){c.owners=c.owners.filter(x=>x!==id);modalState.drawOwners()}
    else if(m==="cardsave"){syncCardFields();if(!c.title.trim()){$("#f-title").focus();return}
      const o=modalState.orig,pn=id=>(person(id)||{}).name||"?";
      diffHist({...o,description:sanitizeHTML(o.description)},c,{title:(a,b)=>`Title changed to “${b}”`,description:()=>"Description updated"}).forEach(t=>logHist(c,t));
      c.owners.filter(x=>!o.owners.includes(x)).forEach(x=>logHist(c,`Owner added: ${pn(x)}`));
      o.owners.filter(x=>!c.owners.includes(x)).forEach(x=>logHist(c,`Owner removed: ${pn(x)}`));
      if(c.updates.length>o.updates.length)logHist(c,"Posted an update");
      const newCol=c.column;c.column=o.column; // the column change goes through moveCard so the card lands at the end of its new column
      S.cards[S.cards.indexOf(o)]=c;closeModal();
      if(newCol!==o.column)moveCard(c.id,newCol,null);else{save();render()}
      toast("Saved")}
    else if(m==="carddel")askConfirm(`Delete “${modalState.orig.title}”? This cannot be undone.`,"Delete").then(ok=>{if(!ok)return;
      S.cards=S.cards.filter(x=>x.id!==c.id);save();closeModal();render();toast("Deleted")});
    return;
  }
  if(modalState.kind==="goal"){
    const g=modalState.obj;
    if(m==="savegoal"){const t=$("#f-title").value.trim();if(!t){$("#f-title").focus();return}
      const next={title:t,level:levelOf($("#f-team").value),team:$("#f-team").value,parentId:modalState.parentId,description:$("#f-desc").value,deliverables:$("#f-deliv").value};
      const nm=id=>id?(goal(id)||{}).title||"?":"none";
      const changes=diffHist(g,next,{title:(a,b)=>`Title changed to “${b}”`,level:(a,b)=>`Type changed from ${a} to ${b}`,team:(a,b)=>`Team changed from ${a} to ${b}`,parentId:(a,b)=>`Linked to goal changed from ${nm(a)} to ${nm(b)}`,description:()=>"Description updated",deliverables:()=>"Deliverables updated"});
      Object.assign(g,next);
      if(modalState.isNew){g.history=[];logHist(g,"Created");S.goals.push(g)}else changes.forEach(c=>logHist(g,c));
      save();closeModal();render();toast("Goal saved")}
    if(m==="delgoal")askConfirm(`Delete the goal “${g.title}”? Rocks and child goals linked to it will be unlinked.`,"Delete goal").then(ok=>{if(!ok)return;
      S.goals=S.goals.filter(x=>x.id!==g.id);S.goals.forEach(x=>{if(x.parentId===g.id)x.parentId=null});S.rocks.forEach(r=>{if(r.goalId===g.id)r.goalId=null});save();closeModal();render();toast("Goal deleted")});
  }else if(modalState.kind==="rock"){
    const r=modalState.obj;
    if(m==="updadd"){const t=$("#f-newupd").value.trim();if(!t)return;syncRockFields();r.updates.unshift({at:todayISO(),text:t});drawRockModal()}
    else if(m==="ltab"){syncRockFields();modalState.left=b.dataset.tab;drawRockModal();if(modalState.left==="milestones")$("#modal .msr input.mt")?.focus()}
    else if(m==="mstoggle"){const ms=r.milestones.find(x=>x.id===id);ms.done=!ms.done; // update in place, no redraw
      const row=b.closest(".msr");row.classList.toggle("done",ms.done);b.setAttribute("aria-pressed",ms.done);b.title=`Mark ${ms.done?"to do":"done"}`;$(".mdate",row).className=`mdate ${msDateCls(ms)}`}
    else if(m==="pickdate"){const inp=b.nextElementSibling;try{inp.showPicker()}catch(_){inp.focus()}}
    else if(m==="msdel"){r.milestones=r.milestones.filter(x=>x.id!==id);drawRockModal()}
    else if(m==="msadd")addModalMilestone();
    else if(m==="saverock"){syncRockFields();if(!r.title.trim()){if(!$("#f-title")){modalState.left="details";drawRockModal()}$("#f-title").focus();return}
      r.milestones=r.milestones.map(x=>({...x,title:x.title.trim()})).filter(x=>x.title);
      const o=modalState.orig,pn=id=>id?(person(id)||{}).name||"?":"none",gn=id=>id?(goal(id)||{}).title||"?":"none";
      if(modalState.isNew){r.history=[];logHist(r,"Created")}else{
        diffHist(o,r,{title:(a,b)=>`Title changed to “${b}”`,ownerId:(a,b)=>`Owner changed from ${pn(a)} to ${pn(b)}`,team:(a,b)=>`Team changed from ${a} to ${b}`,quarter:(a,b)=>`Moved from ${a} to ${b}`,status:(a,b)=>`Status changed from ${a} to ${b}`,goalId:(a,b)=>`Goal changed from ${gn(a)} to ${gn(b)}`,trackBR:(a,b)=>b?"Now tracked in Business Review":"No longer tracked in Business Review",description:()=>"Description updated",deliverables:()=>"Deliverables updated"}).forEach(c=>logHist(r,c));
        if(r.updates.length>(o.updates||[]).length)logHist(r,"Posted an update");
        const before=new Map((o.milestones||[]).map(x=>[x.id,x]));
        r.milestones.forEach(x=>{const b=before.get(x.id);
          if(!b)logHist(r,`Milestone “${x.title}” added`);
          else{if(b.done!==x.done)logHist(r,`Milestone “${x.title}” marked ${x.done?"done":"to do"}`);if(b.title!==x.title)logHist(r,`Milestone renamed to “${x.title}”`);if((b.deadline||"")!==(x.deadline||""))logHist(r,`Milestone “${x.title}” deadline ${x.deadline?`set to ${fmtDate(x.deadline)}`:"removed"}`)}
          before.delete(x.id)});
        before.forEach(b=>logHist(r,`Milestone “${b.title}” removed`));
      }
      const i=S.rocks.findIndex(x=>x.id===r.id);i>=0?S.rocks[i]=r:S.rocks.push(r);quarterFilter=r.quarter;S.quarter=r.quarter;save();closeModal();render();toast("Rock saved")}
    else if(m==="delrock"){
      // window.confirm() is silently blocked in some embedded browsers, so use the in-app dialog
      askConfirm(`Delete the rock “${modalState.orig.title}” and its ${r.milestones.length} milestone${r.milestones.length===1?"":"s"}? This cannot be undone.`,"Delete rock").then(ok=>{
        if(!ok)return;S.rocks=S.rocks.filter(x=>x.id!==r.id);expanded.delete(r.id);if(updOpen&&updOpen.id===r.id)updOpen=null;save();closeModal();render();toast("Rock deleted")})}
  }else if(modalState.kind==="quickupd"&&m==="quickpost"){
    const t=$("#f-newupd").value.trim();if(!t){$("#f-newupd").focus();return}
    modalState.target.updates.unshift({at:todayISO(),text:t});save();closeModal();render();toast("Update posted")
  }
});
function addModalMilestone(){
  const r=modalState.obj,ms={id:uid(),title:"",done:false,deadline:"",updates:[]};
  r.milestones.push(ms);drawRockModal();$(`#modal [data-mf="title"][data-id="${ms.id}"]`)?.focus();
}
$("#modal").addEventListener("input",e=>{
  const f=e.target.dataset.mf;if(!f||modalState?.kind!=="rock")return;
  const ms=modalState.obj.milestones.find(x=>x.id===e.target.dataset.id);if(!ms)return;
  ms[f]=e.target.value;
  if(f==="deadline"){const wrap=e.target.closest(".mdate");wrap.className=`mdate ${msDateCls(ms)}`;$("button",wrap).textContent=ms.deadline?fmtDate(ms.deadline):"Set date"}
});
$("#modal").addEventListener("keydown",e=>{
  // Enter in a milestone name: jump to the next one, or add a new one at the end
  if(e.key==="Enter"&&e.target.matches(".msr input.mt")){e.preventDefault();const all=[...document.querySelectorAll("#modal .msr input.mt")],i=all.indexOf(e.target);i<all.length-1?all[i+1].focus():addModalMilestone()}
});
$("#modal").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="f-newupd"&&(modalState?.kind==="rock"||modalState?.kind==="card")){e.preventDefault();$('[data-m="updadd"]').click()}});

render();
</script>
