const {createApi,createMemoryStore,createRights,parsePrincipal,displayName}=EosApiCore;
const tests=[];const test=(name,fn)=>tests.push({name,fn});
function assert(cond,msg){if(!cond)throw new Error(msg||"assertion failed")}
const eq=(a,b,msg)=>assert(JSON.stringify(a)===JSON.stringify(b),`${msg||"not equal"}: ${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`);
const sha256=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
let n=0;const newId=()=>"id"+(++n);
const user=(email,claims=[])=>({identityProvider:"aad",userId:"u-"+email,userDetails:email,userRoles:["anonymous","authenticated"],claims});
// ana is an admin through ADMIN_EMAILS; everyone else starts as "pending"
function setup(settings={ALLOWED_EMAIL_DOMAINS:"letsgrow.com"}){
  const store=createMemoryStore();
  return {store,api:createApi({store,settings:{APP_ENV:"test",SEED:"sample",ADMIN_EMAILS:"ana.de.vries@letsgrow.com",...settings},sha256,newId})};
}
const ana=user("ana.de.vries@letsgrow.com"),bob=user("bob@letsgrow.com");
// a small org tree: company C → department D (teams T1, T2), department E (team T3); meeting F (tracked + escalated rocks)
const UNITS=[{id:"C",kind:"company",name:"Co"},{id:"D",kind:"department",name:"D"},{id:"T1",kind:"team",name:"T1",parentId:"D"},
  {id:"T2",kind:"team",name:"T2",parentId:"D"},{id:"E",kind:"department",name:"E"},{id:"T3",kind:"team",name:"T3",parentId:"E"},
  {id:"F",kind:"forum",name:"F",includeTracked:true,includeEscalated:true}];
async function tree(api){for(const u of UNITS)await api.putItem({principal:ana,params:{collection:"units",id:u.id},body:{record:u}})}
const asAna=(api,c,rec)=>api.putItem({principal:ana,params:{collection:c,id:rec.id},body:{record:rec}});
// ana (admin) assigns someone to a unit, the way the People tab does
async function assign(api,principal,unitIds){
  const me=(await api.data({principal})).json.meId;
  const people=(await api.data({principal:ana})).json.people,p=people.find(x=>x.id===me);
  return api.putItem({principal:ana,params:{collection:"people",id:p.id},body:{record:{...p,unitIds},ifMatch:p._etag}});
}

  eq(setup({ALLOWED_EMAIL_DOMAINS:"*"}).api.access(user("x@evil.com")).ok,true,"*");
});

test("roles: once assigned, a member sees everything and edits work, but not the org tree or people",async()=>{
  const {api}=setup();await tree(api);
  eq((await assign(api,bob,["T1"])).status,200);

  eq((await api.putItem({principal:bob,params:{collection:"meta",id:"meta"},body:{record:{id:"meta",version:10}}})).status,200,"meta (migrations)");
  eq((await api.putItem({principal:bob,params:{collection:"units",id:"u1"},body:{record:{id:"u1"}}})).status,403,"units");

  eq((await api.putItem({principal:bob,params:{collection:"people",id:me.id},body:{record:{...me,admin:true}}})).status,403,"can't make yourself admin");
  eq((await api.deleteItem({principal:bob,params:{collection:"units",id:"u1"}})).status,403,"no unit deletes");
});

test("rights: flow down the tree, never up",async()=>{
  const R=createRights({units:UNITS,people:[],adminEmails:["boss@x.com"]});
  const can=(units,unitId)=>R.hasRights({unitIds:units},unitId);
  eq(UNITS.map(u=>can(["C"],u.id)),[true,true,true,true,true,true,true],"a director (company) has rights everywhere");
  eq(UNITS.map(u=>can(["D"],u.id)),[false,true,true,true,false,false,false],"department: itself and its teams");
  eq(UNITS.map(u=>can(["T1"],u.id)),[false,false,true,false,false,false,false],"team: only itself, not the department above");
  eq(UNITS.map(u=>can(["F"],u.id)),[false,false,false,false,false,false,true],"meeting: only itself");
  eq(R.hasRights({email:"Boss@x.com",unitIds:[]},"T3"),true,"admins everywhere");
  eq(R.hasRights({unitIds:[]},"T1"),false,"waiting: nowhere");
});
test("rights: the team filter shows your branch",async()=>{
  const R=createRights({units:UNITS,people:[],adminEmails:[]});
  eq(R.branch({unitIds:["T1"]}),["C","D","T1"],"team member: company, own department, own team");
  eq(R.branch({unitIds:["D"]}),["C","D","T1","T2"],"department member: also its teams");
  eq(R.branch({unitIds:["T1","F"]}),["C","D","T1","F"]);
  eq(R.branch({unitIds:["C"]}),UNITS.map(u=>u.id),"director: everything");
});
test("rights: meeting members fully edit the rocks the meeting shows",async()=>{
  const R=createRights({units:UNITS,people:[],adminEmails:[]}),f={unitIds:["F"]};
  const esc={id:"r",unitId:"T3",status:"escalate"},tracked={id:"r",unitId:"T2",trackIn:["F"]},plain={id:"r",unitId:"T2"};
  eq([R.canEditRock(f,esc),R.canEditRock(f,tracked),R.canEditRock(f,plain)],[true,true,false]);
  eq(R.writeAllowed(f,"rocks",esc,{...esc,status:"on_track"}),true,"resolving an escalation (the rock then leaves the meeting)");
  eq(R.writeAllowed(f,"rocks",esc,{...esc,unitId:"T1"}),false,"but not moving it to a team you have no rights on");
  eq(R.writeAllowed(f,"rocks",null,{...esc,id:"new"}),false,"nor creating an (escalated) rock for another team");
  eq(R.writeAllowed(f,"rocks",null,{id:"new",unitId:"F"}),true,"the meeting's own rocks: yes");
  eq(R.writeAllowed(f,"goals",null,{id:"g",unitId:"T3"}),false,"goals of other teams: no");
});
test("organisation: structure is managed from the unit above, never by the unit itself",async()=>{
  const R=createRights({units:UNITS,people:[],adminEmails:[]}),u=id=>UNITS.find(x=>x.id===id);
  const manages=units=>UNITS.map(x=>R.canManageUnit({unitIds:units},x));
  eq(manages(["C"]),[false,true,true,true,true,true,true],"director: everything below the company");
  eq(manages(["D"]),[false,false,true,true,false,false,false],"department: its teams, not itself");
  eq(manages(["T1"]),[false,false,false,false,false,false,false],"team: nothing");
  eq(manages(["F"]),[false,false,false,false,false,false,false],"meeting: nothing (not even its own rules)");
  const dep={unitIds:["D"]},dir={unitIds:["C"]},w=(p,b,a)=>R.writeAllowed(p,"units",b,a);
  eq(w(dep,null,{id:"T9",kind:"team",name:"New",parentId:"D"}),true,"department adds a team to itself");
  eq(w(dep,null,{id:"T9",kind:"team",name:"New",parentId:"E"}),false,"… not to another department");
  eq(w(dep,u("T1"),{...u("T1"),name:"Renamed"}),true,"department renames its team");
  eq(w(dep,u("D"),{...u("D"),name:"Renamed"}),false,"… not itself");
  eq(w(dep,null,{id:"D9",kind:"department",name:"New"}),false,"… nor adds departments");
  eq(w(dep,u("T1"),{...u("T1"),parentId:"E"}),false,"moving a team needs rights on both departments");
  eq(w(dir,u("T1"),{...u("T1"),parentId:"E"}),true,"… which a director has");
  eq(w(dir,null,{id:"D9",kind:"department",name:"New"}),true,"director adds departments");
  eq(w(dir,u("F"),{...u("F"),includeTracked:false}),true,"… and sets meeting rules");
  eq(w(dir,null,{id:"C2",kind:"company",name:"Other"}),false,"no second company (admins only)");
  eq(w(dir,u("T1"),{...u("T1"),kind:"department"}),false,"no changing a unit's kind");
  eq(w(dep,u("T2"),null),true,"department deletes its team");eq(w(dep,u("D"),null),false,"… not itself");
});
test("organisation: membership is managed in your own units and below",async()=>{
  const R=createRights({units:UNITS,people:[],adminEmails:[]});
  const x={id:"x",name:"X",email:"x@a.com",color:"#000",unitIds:["T1"]},with_=ids=>({...x,unitIds:ids});
  const w=(units,after,before=x)=>R.writeAllowed({unitIds:units},"people",before,after);
  eq(w(["T1"],x),true,"nothing changed");
  eq(w(["T1"],with_([])),true,"team member removes a colleague from the team");
  eq(w(["T2"],with_(["T1","T2"])),true,"… and adds people to their own team");
  eq(w(["T1"],with_(["T1","T2"])),false,"… not to another team");
  eq(w(["T1"],with_(["T1","D"])),false,"… nor to the department above");
  eq(w(["D"],with_(["T1","D","T2"])),true,"department member: the department and its teams");
  eq(w(["D"],with_(["T1","T3"])),false,"… not other departments' teams");
  eq(w(["F"],with_(["T1","F"])),true,"meeting members add members, like a team");
  eq(w(["C"],with_(["T3","E","F"])),true,"director: everyone everywhere");
  eq(w(["C"],{...x,name:"Renamed"}),false,"names, e-mail, colour: not by members");
  eq(w(["C"],{...x,admin:true}),false,"only admins grant admin");
  eq(R.writeAllowed({email:"a@x.com",admin:true},"people",x,{...x,admin:true}),true,"… like this");
  eq(w(["C"],x,null),false,"people are created at sign-in, not by members");
  eq(w(["C"],null,x),false,"… nor deleted by them");
});
const DT={id:"P",kind:"forum",name:"DT Team",private:true,includeTracked:false,includeEscalated:false};
test("private meetings: only their direct members, not directors, not admins",async()=>{
  const R=createRights({units:[...UNITS,DT],people:[],adminEmails:["boss@x.com"]});
  const dir={unitIds:["C"]},mem={unitIds:["P"]},br={unitIds:["F"]},admin={email:"boss@x.com",unitIds:[]};
  eq([R.hasRights(dir,"P"),R.hasRights(admin,"P"),R.hasRights(mem,"P")],[false,false,true],"rights");
  eq([R.canSeeBoard(dir,"P"),R.canSeeBoard(admin,"P"),R.canSeeBoard(mem,"P")],[false,false,true],"board");
  const rock={id:"r",unitId:"P",status:"escalate",trackIn:["F"]};
  eq([R.canSeeRock(dir,rock),R.canSeeRock(br,rock),R.canSeeRock(admin,rock),R.canSeeRock(mem,rock)],[false,false,false,true],"rocks: not even escalated or tracked ones show elsewhere");
  eq([R.writeAllowed(admin,"rocks",null,{id:"x",unitId:"P"}),R.writeAllowed(mem,"rocks",null,{id:"x",unitId:"P"})],[false,true],"writing rocks");
  eq([R.writeAllowed(admin,"cards",{id:"c",unitId:"P"},null),R.writeAllowed(mem,"cards",{id:"c",unitId:"P"},null)],[false,true],"deleting cards");
  eq([R.branch(dir).includes("P"),R.branch(admin).includes("P"),R.branch(mem).includes("P")],[false,false,true],"team filter");
  eq([R.writeAllowed(dir,"units",DT,{...DT,name:"X"}),R.writeAllowed(dir,"units",DT,{...DT,private:false}),R.writeAllowed(dir,"units",DT,null)],[false,false,false],"a director can't rename, un-private or delete it");
  eq([R.writeAllowed(admin,"units",DT,{...DT,private:false}),R.writeAllowed(mem,"units",DT,{...DT,private:false})],[false,true],"… nor an admin; members can");
  const x={id:"x",name:"X",email:"x@a.com",unitIds:["T1"]};
  eq([R.writeAllowed(dir,"people",x,{...x,unitIds:["T1","P"]}),R.writeAllowed(mem,"people",x,{...x,unitIds:["T1","P"]})],[false,true],"members add members; directors can't");
  eq(R.writeAllowed(admin,"people",{...admin,id:"a",name:"A"},{...admin,id:"a",name:"A",unitIds:["P"]}),true,"break-glass: an admin can add themselves");
});

test("server: everyone changes their own name, initials and colour (Profile page), nothing else and nobody else's",async()=>{
  const {api}=setup();await tree(api);await assign(api,bob,["T1"]);

test("server: members only change their own branch; moving needs rights on both sides",async()=>{
  const {api}=setup();await tree(api);await assign(api,bob,["T1"]);
  const put=(c,rec)=>api.putItem({principal:bob,params:{collection:c,id:rec.id},body:{record:rec}}).then(r=>r.status);
  eq(await put("goals",{id:"g1",unitId:"T1"}),200,"own team goal");
  eq(await put("goals",{id:"g2",unitId:"D"}),403,"department goal (above you)");
  eq(await put("rocks",{id:"r2",unitId:"T2"}),403,"another team's rock");
  await asAna(api,"rocks",{id:"r3",unitId:"T3"});
  eq(await put("rocks",{id:"r3",unitId:"T1"}),403,"taking over another team's rock");
  eq(await put("rocks",{id:"r1",unitId:"T1"}),200);eq(await put("rocks",{id:"r1",unitId:"T3"}),403,"handing a rock to another team");
  eq((await api.deleteItem({principal:bob,params:{collection:"rocks",id:"r3"}})).status,403,"deleting another team's rock");
  eq((await api.deleteItem({principal:bob,params:{collection:"rocks",id:"r1"}})).status,204,"deleting your own");
});
test("server: Level 10 cards are only sent where you have rights",async()=>{
  const {api}=setup();await tree(api);
  for(const [id,unitId] of [["c1","T1"],["c2","T2"],["c4","F"]])await asAna(api,"cards",{id,unitId});
  await assign(api,bob,["T1"]);
  eq((await api.data({principal:bob})).json.cards.map(c=>c.id),["c1"],"team member: own board");
  await assign(api,bob,["D"]);
  eq((await api.data({principal:bob})).json.cards.map(c=>c.id).sort(),["c1","c2"],"department member: its teams' boards too");
  eq((await api.data({principal:ana})).json.cards.length,3,"admin: all");
});
test("rocks, Level 10 cards and scorecards live on teams and meetings only, for everyone",async()=>{
  const {api}=setup();await tree(api);
  for(const c of ["rocks","cards","measurables"]){
    eq((await asAna(api,c,{id:"x1",unitId:"D"})).status,403,`${c}: not on a department, even for an admin`);
    eq((await asAna(api,c,{id:"x2",unitId:"C"})).status,403,`${c}: not on the company`);
    eq((await asAna(api,c,{id:"x3",unitId:"T1"})).status,200,`${c}: on a team`);
    eq((await asAna(api,c,{id:"x4",unitId:"F"})).status,200,`${c}: on a meeting`);
  }
  eq((await asAna(api,"goals",{id:"g1",unitId:"D"})).status,200,"goals: any level");
  const R=createRights({units:UNITS,people:[],adminEmails:[]});
  eq(UNITS.map(u=>R.canSeeBoard({unitIds:["C"]},u.id)),[false,false,true,true,false,true,true],"boards exist on teams and meetings only");
});
test("server: scorecards (measurables) like the Level 10 board: your teams, members edit, private meetings members only",async()=>{
  const {api}=setup();await tree(api);await asAna(api,"units",DT);
  const dir=user("dir@letsgrow.com"),dave=user("dave@letsgrow.com");
  await assign(api,bob,["P"]);await assign(api,dir,["C"]);await assign(api,dave,["T1"]);
  const put=(p,rec)=>api.putItem({principal:p,params:{collection:"measurables",id:rec.id},body:{record:rec}}).then(r=>r.status);
  eq(await put(dave,{id:"m1",unitId:"T1",title:"Calls",goal:"20+",values:{"2026-10-12":21}}),200,"a member adds one to their team");
  eq(await put(dave,{id:"m2",unitId:"T2",title:"X"}),403,"… not to another team");
  eq(await put(dir,{id:"m2",unitId:"T2",title:"X"}),200,"a director: to every team");
  eq(await put(dir,{id:"m3",unitId:"P",title:"Y"}),403,"… but not to the private DT Team");
  eq(await put(bob,{id:"m3",unitId:"P",title:"Y"}),200,"its member can");
  const ids=async p=>(await api.data({principal:p})).json.measurables.map(m=>m.id).sort();
  eq(await ids(dave),["m1"],"team member: own scorecard");
  eq(await ids(dir),["m1","m2"],"director: every team, not the DT Team");
  eq(await ids(ana),["m1","m2"],"admin: not the DT Team either");
  eq(await ids(bob),["m3"],"DT member: the DT scorecard");
});
test("server: a measurable tracked in a meeting is shown to (and edited by) its members, like rocks",async()=>{
  const {api}=setup();await tree(api);await asAna(api,"units",DT);
  const dave=user("dave@letsgrow.com"),erin=user("erin@letsgrow.com");
  await assign(api,dave,["T1"]);await assign(api,erin,["F"]);await assign(api,bob,["P"]);
  const put=(p,rec)=>api.putItem({principal:p,params:{collection:"measurables",id:rec.id},body:{record:rec}}).then(r=>r.status);
  eq(await put(dave,{id:"m1",unitId:"T1",title:"Calls",trackIn:["F"]}),200,"tracked in the meeting");
  eq(await put(dave,{id:"m2",unitId:"T1",title:"Visits"}),200,"not tracked");
  eq(await put(bob,{id:"m3",unitId:"P",title:"Secret",trackIn:["F"]}),200,"a private meeting's own");
  const ids=async p=>(await api.data({principal:p})).json.measurables.map(m=>m.id).sort();
  eq(await ids(erin),["m1"],"meeting member: only the tracked one, never a private meeting's");
  const got=(await api.data({principal:erin})).json.measurables[0];
  eq((await api.putItem({principal:erin,params:{collection:"measurables",id:"m1"},body:{record:{...got,_etag:undefined,values:{"2026-10-12":5}},ifMatch:got._etag}})).status,200,"… and may fill it in");
  eq(await put(erin,{id:"m4",unitId:"T1",title:"X"}),403,"but not add one to the team");
});
test("the rights block is identical in index.html and api/src/core.js",async()=>{
  const block=s=>{const a=s.indexOf("/* rights:start"),b=s.indexOf("/* rights:end */");assert(a>=0&&b>a,"markers missing");return s.slice(a,b)};
  const [page,core]=await Promise.all(["../index.html","../api/src/core.js"].map(u=>fetch(u,{cache:"no-store"}).then(r=>r.text())));
  assert(block(page).replace(/\r/g,"")===block(core).replace(/\r/g,""),"the two copies differ: copy the block from one file to the other");
});
test("items: create, update with ETag, stale ETag → 412",async()=>{
  const {api}=setup();await tree(api);
  const put=(record,ifMatch)=>api.putItem({principal:ana,params:{collection:"rocks",id:record.id},body:{record:{unitId:"T1",...record},ifMatch}});
  const c=await put({id:"r1",title:"Rock"});eq(c.status,200);const e1=c.json.record._etag;
  const u=await put({id:"r1",title:"Rock v2",_etag:"ignored"},e1);eq(u.status,200);eq(u.json.record.title,"Rock v2");
  eq((await put({id:"r1",title:"Rock v3"},e1)).status,412,"stale etag");
  const d=(await api.data({principal:ana})).json;eq(d.rocks.map(r=>r.title),["Rock v2"]);
});
test("items: validation",async()=>{
  const {api}=setup();
  const put=(collection,id,record)=>api.putItem({principal:ana,params:{collection,id},body:{record}}).then(r=>r.status);
  eq(await put("secrets","x",{id:"x"}),400,"unknown collection");
  eq(await put("rocks","a/b",{id:"a/b"}),400,"bad id");
  eq(await put("rocks","r1",{id:"r2"}),400,"id mismatch");
  eq(await put("meta","x",{id:"x"}),400,"meta must be id meta");
  eq(await put("rocks","meta",{id:"meta"}),400,"id meta only in meta");
  eq(await put("meta","meta",{id:"meta",version:9}),200,"meta record");
  eq((await api.putItem({principal:user("x@evil.com"),params:{collection:"rocks",id:"r1"},body:{record:{id:"r1"}}})).status,403,"not allowed");
});
test("items: delete; meta can't be deleted",async()=>{
  const {api}=setup();await tree(api);
  await api.putItem({principal:ana,params:{collection:"cards",id:"c1"},body:{record:{id:"c1",unitId:"T1"}}});
  eq((await api.deleteItem({principal:ana,params:{collection:"cards",id:"c1"}})).status,204);
  eq((await api.data({principal:ana})).json.cards.length,0);
  eq((await api.deleteItem({principal:ana,params:{collection:"meta",id:"meta"}})).status,400);
});
test("images: pasted data URLs become attachments (deduplicated) and are served back",async()=>{
  const {api,store}=setup();await tree(api);
  const html=`<div>a<img src="data:image/png;base64,${PNG}">b<img src="data:image/png;base64,${PNG}"></div>`;
  const r=await api.putItem({principal:ana,params:{collection:"cards",id:"c1"},body:{record:{id:"c1",unitId:"T1",description:html}}});
  const id=await sha256(PNG);
  eq(r.json.record.description,`<div>a<img src="/api/attachments/${id}">b<img src="/api/attachments/${id}"></div>`);
  eq(Object.keys(store.db.attachments),[id],"stored once");
  const a=await api.attachment({principal:ana,params:{id}});
  eq([a.status,a.contentType,a.base64],[200,"image/png",PNG]);
  eq((await api.attachment({principal:ana,params:{id:"../x"}})).status,400);
  eq((await api.attachment({principal:ana,params:{id:"0".repeat(64)}})).status,404);
  eq((await api.attachment({principal:user("x@evil.com"),params:{id}})).status,403);
});

(async()=>{
  const out=[];let failed=0;
  for(const t of tests){
    try{await t.fn();out.push(`<div class="ok">✓ ${t.name}</div>`)}
    catch(e){failed++;out.push(`<div class="fail">✗ ${t.name}</div><pre>${String(e.stack||e).replace(/</g,"&lt;")}</pre>`)}
  }
  document.getElementById("out").innerHTML=`<p><b>${tests.length-failed} of ${tests.length} passed</b></p>`+out.join("");
  window.testResults={total:tests.length,failed};
})();
</script>
